    const thumbLen = Math.min(trackLen, Math.max((ch / sh) * trackLen, SB_MIN_THUMB));
    maxDash = Math.max(0, trackLen - thumbLen);
    maxScroll = sh - ch;
    const off = maxScroll > 0 ? (st / maxScroll) * maxDash : 0;
    const d = `M ${x} ${y0} L ${x} ${y1}`;
    svg.setAttribute("viewBox", `0 0 ${SB_GUTTER} ${ch}`);
    for (const p of [hit, thumb]) {
      p.setAttribute("d", d);
      // one dash the length of the thumb, then a gap longer than the track:
      // the dash IS the thumb, and sliding the offset scrolls it
      p.setAttribute("stroke-dasharray", `${thumbLen} ${trackLen + thumbLen}`);
      p.setAttribute("stroke-dashoffset", String(-off));
    }
  }

  let drag = null;
  hit.addEventListener("pointerdown", (e) => {
    if (maxDash <= 0) return;
    e.preventDefault();
    e.stopPropagation();
    hit.setPointerCapture(e.pointerId);
    drag = {
      id: e.pointerId,
      startY: e.clientY,
      startTop: scrollNode.scrollTop,
      maxDash,
      maxScroll,
    };
    shell.dataset.drag = "true";
  });
  hit.addEventListener("pointermove", (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    e.preventDefault();
    const delta = drag.maxDash > 0
      ? ((e.clientY - drag.startY) / drag.maxDash) * drag.maxScroll
      : 0;
    scrollNode.scrollTop = Math.min(drag.maxScroll, Math.max(0, drag.startTop + delta));
    update();
  });
  const endDrag = (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    if (hit.hasPointerCapture(e.pointerId)) hit.releasePointerCapture(e.pointerId);
    drag = null;
    delete shell.dataset.drag;
  };
  hit.addEventListener("pointerup", endDrag);
  hit.addEventListener("pointercancel", endDrag);
  hit.addEventListener("lostpointercapture", endDrag);

  const scrollTarget = page ? window : scrollNode;
  scrollTarget.addEventListener("scroll", update, { passive: true });
  // typing and pasting grow a textarea's scrollHeight without any observer
  // firing — the input event is the only DOM signal for it
  scrollNode.addEventListener?.("input", update, { passive: true });
  let ro = null;
  if (typeof ResizeObserver !== "undefined") {
    ro = new ResizeObserver(update);
    ro.observe(page ? document.body : scrollNode);
  }
  if (page) window.addEventListener("resize", update, { passive: true });
  // setTimeout, not rAF: animation frames stall in hidden tabs, and the
  // first measurement must happen regardless
  setTimeout(update, 0);

  return {
    update,
    destroy() {
      scrollTarget.removeEventListener("scroll", update);
      scrollNode.removeEventListener?.("input", update);
      if (ro) ro.disconnect();
      if (page) window.removeEventListener("resize", update);
      shell.remove();
    },
  };
}

/* ===== src/card.js ===== */
// Share card encoding: bech32m (BIP-350) with HRP "psr".
//
// Card payload before 5-bit conversion:
//   version symbol (5-bit value 1, kept outside the byte payload)
//   bytes: index (1) || set_id (2) || share_y (32)  = 35 bytes
// 35 bytes -> 56 five-bit symbols exactly. Full string:
//   "psr" "1" <version:1><payload:56><checksum:6>  = 67 characters.
// The BCH checksum guarantees detection of any error touching up to 4
// characters at this length, and misses worse corruption with
// probability ~2^-30.
//
// The owner key (PKR v2 kits only) uses the same machinery with HRP
// "keep": payload set_id (2) || K_app (32) = 34 bytes -> 55 symbols
// (2 bits of zero padding), "keep" "1" <version:1><payload:55><checksum:6>
// = 67 characters as well. The longer HRP makes the two code kinds
// impossible to confuse in software, and the KEEP1 prefix makes them
// hard to confuse on paper.

const HRP = "psr";
const CARD_VERSION = 1;
const CARD_LENGTH = 67;
const SHARE_LEN = 32;

const OWNER_HRP = "keep";
const OWNER_VERSION = 1;
const OWNER_KEY_LENGTH = 67;

const CHARSET = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
const BECH32M_CONST = 0x2bc830a3;
const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];

class CardError extends Error {
  constructor(code, message) {
    super(message);
    this.name = "CardError";
    this.code = code; // BAD_CHARSET | BAD_CHECKSUM | BAD_HRP | BAD_VERSION | BAD_LENGTH
  }
}

function polymod(values) {
  let chk = 1;
  for (const v of values) {
    const top = chk >>> 25;
    chk = ((chk & 0x1ffffff) << 5) ^ v;
    for (let i = 0; i < 5; i++) {
      if ((top >>> i) & 1) chk ^= GEN[i];
    }
  }
  return chk >>> 0;
}

function hrpExpand(hrp) {
  const out = [];
  for (let i = 0; i < hrp.length; i++) out.push(hrp.charCodeAt(i) >> 5);
  out.push(0);
  for (let i = 0; i < hrp.length; i++) out.push(hrp.charCodeAt(i) & 31);
  return out;
}

function createChecksum(hrp, data) {
  const values = [...hrpExpand(hrp), ...data, 0, 0, 0, 0, 0, 0];
  const mod = polymod(values) ^ BECH32M_CONST;
  const out = [];
  for (let i = 0; i < 6; i++) out.push((mod >>> (5 * (5 - i))) & 31);
  return out;
}

function verifyChecksum(hrp, data) {
  return polymod([...hrpExpand(hrp), ...data]) === BECH32M_CONST;
}

/** General bech32m encode (exported for test vectors). */
function bech32mEncode(hrp, data) {
  const combined = [...data, ...createChecksum(hrp, data)];
  return hrp + "1" + combined.map((d) => CHARSET.charAt(d)).join("");
}

/** General bech32m decode -> { hrp, data } (checksum stripped). Throws CardError. */
function bech32mDecode(str) {
  const pos = str.lastIndexOf("1");
  if (pos < 1 || pos + 7 > str.length) {
    throw new CardError("BAD_LENGTH", "not a valid code: missing or misplaced separator");
  }
  const hrp = str.slice(0, pos);
  const data = [];
  for (const ch of str.slice(pos + 1)) {
    const d = CHARSET.indexOf(ch);
    if (d === -1) throw new CardError("BAD_CHARSET", `invalid character "${ch}"`);
    data.push(d);
  }
  if (!verifyChecksum(hrp, data)) {
    throw new CardError("BAD_CHECKSUM", "checksum mismatch, there is a typo somewhere");
  }
  return { hrp, data: data.slice(0, -6) };
}

/** Convert between bit group sizes (BIP-173 reference semantics). */
function convertBits(data, from, to, pad) {
  let acc = 0;
  let bits = 0;
  const out = [];
  const maxv = (1 << to) - 1;
  for (const value of data) {
    if (value < 0 || value >> from !== 0) throw new CardError("BAD_CHARSET", "invalid data value");
    acc = (acc << from) | value;
    bits += from;
    while (bits >= to) {
      bits -= to;
      out.push((acc >> bits) & maxv);
    }
  }
  if (pad) {
    if (bits > 0) out.push((acc << (to - bits)) & maxv);
  } else if (bits >= from || ((acc << (to - bits)) & maxv) !== 0) {
    throw new CardError("BAD_LENGTH", "invalid padding in data");
  }
  return out;
}

/** Encode one share card. setId: Uint8Array(2), shareY: Uint8Array(32). */
function encodeCard(index, setId, shareY) {
  if (!Number.isInteger(index) || index < 1 || index > 255) {
    throw new RangeError("key index must be 1..255");
  }
  if (setId.length !== 2 || shareY.length !== SHARE_LEN) {
    throw new RangeError("bad setId or share length");
  }
  const payload = new Uint8Array(1 + 2 + SHARE_LEN);
  payload[0] = index;
  payload.set(setId, 1);
  payload.set(shareY, 3);
  const data = [CARD_VERSION, ...convertBits(payload, 8, 5, true)];
  const s = bech32mEncode(HRP, data);
  if (s.length !== CARD_LENGTH) throw new Error(`internal: key length ${s.length}`);
  // canonical form is uppercase — the same form the card is written in
  // (bech32m allows either case; the checksum math runs over lowercase)
  return s.toUpperCase();
}

/**
 * Normalize handwritten input: strip separators/whitespace, uppercase
 * (the canonical form). Mixed case is accepted (normalized) — friendlier
 * for hand-typed entry, and the checksum still validates the result. The
 * letter "o" is not in the bech32 charset, so any o/O typed is a misread
 * zero: map it to "0".
 */
function normalizeCardInput(raw) {
  return raw.replace(/[\s\-.·_]/g, "").toUpperCase().replace(/O/g, "0");
}

/** Decode one card string -> { version, index, setId, shareY }. Throws CardError. */
function decodeCard(raw) {
  const str = normalizeCardInput(raw);
  if (str.length !== CARD_LENGTH) {
    throw new CardError(
      "BAD_LENGTH",
      `a key code is exactly ${CARD_LENGTH} characters, got ${str.length}`
    );
  }
  // bech32m arithmetic is defined over the lowercase charset
  const { hrp, data } = bech32mDecode(str.toLowerCase());
  if (hrp === OWNER_HRP) {
    throw new CardError("BAD_HRP", "This is the owner's key, not a holders' key");
  }
  if (hrp !== HRP) throw new CardError("BAD_HRP", `expected a "${HRP}" key code`);
  if (data.length === 0 || data[0] !== CARD_VERSION) {
    throw new CardError("BAD_VERSION", "unknown key version. Is this from a newer kit?");
  }
  const payload = Uint8Array.from(convertBits(data.slice(1), 5, 8, false));
  if (payload.length !== 1 + 2 + SHARE_LEN) {
    throw new CardError("BAD_LENGTH", "key payload has the wrong size");
  }
  return {
    version: CARD_VERSION,
    index: payload[0],
    setId: payload.slice(1, 3),
    shareY: payload.slice(3),
  };
}

/** Encode the owner key of a v2 kit. setId: Uint8Array(2), kApp: Uint8Array(32). */
function encodeOwnerKey(setId, kApp) {
  if (setId.length !== 2 || kApp.length !== 32) {
    throw new RangeError("bad setId or owner key length");
  }
  const payload = new Uint8Array(2 + 32);
  payload.set(setId, 0);
  payload.set(kApp, 2);
  const data = [OWNER_VERSION, ...convertBits(payload, 8, 5, true)];
  const s = bech32mEncode(OWNER_HRP, data);
  if (s.length !== OWNER_KEY_LENGTH) throw new Error(`internal: owner key length ${s.length}`);
  return s.toUpperCase();
}

/** Decode one owner key string -> { version, setId, kApp }. Throws CardError. */
function decodeOwnerKey(raw) {
  const str = normalizeCardInput(raw);
  if (str.length !== OWNER_KEY_LENGTH) {
    throw new CardError(
      "BAD_LENGTH",
      `an owner's key is exactly ${OWNER_KEY_LENGTH} characters, got ${str.length}`
    );
  }
  const { hrp, data } = bech32mDecode(str.toLowerCase());
  if (hrp === HRP) {
    throw new CardError("BAD_HRP", "This is a holders' key, not the owner's key");
  }
  if (hrp !== OWNER_HRP) throw new CardError("BAD_HRP", `expected a "${OWNER_HRP}" owner's key`);
  if (data.length === 0 || data[0] !== OWNER_VERSION) {
    throw new CardError("BAD_VERSION", "unknown owner's key version. Is this from a newer kit?");
  }
  const payload = Uint8Array.from(convertBits(data.slice(1), 5, 8, false));
  if (payload.length !== 2 + 32) {
    throw new CardError("BAD_LENGTH", "the owner's key payload has the wrong size");
  }
  return {
    version: OWNER_VERSION,
    setId: payload.slice(0, 2),
    kApp: payload.slice(2),
  };
}

/**
 * Display form: "PSR1 XXXX XXXX ..." — the canonical uppercase string in
 * groups of 4 after the prefix. Uppercase removes the l/1/I lookalikes
 * when handwritten, and the charset has no O, no I and no B, so the only
 * letter-vs-digit pair left is 0 (always the digit — input maps O back
 * to 0). Decode tolerates any case and grouping. The owner key formats
 * the same way; its prefix is KEEP1 and is grouped with the head.
 */
function formatCardForDisplay(card) {
  const s = card.toUpperCase();
  const headLen = s.startsWith(OWNER_HRP.toUpperCase()) ? OWNER_HRP.length + 1 : 4;
  const head = s.slice(0, headLen);
  const rest = s.slice(headLen);
  const groups = [];
  for (let i = 0; i < rest.length; i += 4) groups.push(rest.slice(i, i + 4));
  return [head, ...groups].join(" ");
}

/* ===== src/shamir.js ===== */
// Shamir secret sharing over GF(256), byte-wise: one independent
// degree-(k-1) polynomial per secret byte, share x-coordinate = card
// index 1..n. Any k shares interpolate the secret; k-1 shares carry
// zero information (each unknown coefficient is uniform random).
//
// k = 1 is the degenerate constant polynomial: every share IS the
// secret. The layer above decides where that is acceptable (owner-key
// kits, where the owner key still gates recovery) — here it is just
// well-defined math.



const MIN_K = 1;
const MAX_N = 255;

/**
 * Split `secret` into n shares with threshold k.
 * randomBytes(len) -> Uint8Array supplies polynomial coefficients;
 * production passes crypto.getRandomValues-backed bytes, tests may
 * pass a seeded generator (determinism for known-answer vectors).
 * Returns [{ index, y: Uint8Array }] with index 1..n.
 */
function split(secret, k, n, randomBytes) {
  if (!(secret instanceof Uint8Array) || secret.length === 0) {
    throw new TypeError("secret must be a non-empty Uint8Array");
  }
  if (!Number.isInteger(k) || !Number.isInteger(n)) {
    throw new TypeError("k and n must be integers");
  }
  if (k < MIN_K) throw new RangeError(`threshold k must be >= ${MIN_K}`);
  if (n < k) throw new RangeError("n must be >= k");
  if (n > MAX_N) throw new RangeError(`n must be <= ${MAX_N}`);

  // coefficients a_1..a_{k-1} for every secret byte, drawn up front
  const coefBytes = randomBytes(secret.length * (k - 1));
  if (!(coefBytes instanceof Uint8Array) || coefBytes.length !== secret.length * (k - 1)) {
    throw new TypeError("randomBytes returned wrong length");
  }

  const shares = [];
  for (let x = 1; x <= n; x++) {
    shares.push({ index: x, y: new Uint8Array(secret.length) });
  }
  const coeffs = new Uint8Array(k);
  for (let b = 0; b < secret.length; b++) {
    coeffs[0] = secret[b];
    for (let c = 1; c < k; c++) {
      coeffs[c] = coefBytes[b * (k - 1) + (c - 1)];
    }
    for (const share of shares) {
      share.y[b] = polyEval(coeffs, share.index);
    }
  }
  coeffs.fill(0);
  coefBytes.fill(0);
  return shares;
}

/**
 * Combine exactly k shares [{ index, y }] back into the secret.
 * Caller is responsible for passing precisely the threshold count;
 * duplicate or out-of-range indices throw.
 */
function combine(shares) {
  if (!Array.isArray(shares) || shares.length < MIN_K) {
    throw new RangeError(`need at least ${MIN_K} shares`);
  }
  const seen = new Set();
  const len = shares[0].y.length;
  for (const s of shares) {
    if (!Number.isInteger(s.index) || s.index < 1 || s.index > MAX_N) {
      throw new RangeError(`share index ${s.index} out of range`);
    }
    if (seen.has(s.index)) throw new RangeError(`duplicate share index ${s.index}`);
    seen.add(s.index);
    if (!(s.y instanceof Uint8Array) || s.y.length !== len) {
      throw new TypeError("shares have mismatched lengths");
    }
  }
  const xs = shares.map((s) => s.index);
  const secret = new Uint8Array(len);
  const ys = new Array(shares.length);
  for (let b = 0; b < len; b++) {
    for (let i = 0; i < shares.length; i++) ys[i] = shares[i].y[b];
    secret[b] = interpolateAtZero(xs, ys);
  }
  return secret;
}

/* ===== src/vault.js ===== */
// PKR vault container: the byte format embedded (base64) in a
// personalized RECOVERY.html. Layout (little-endian):
//
//   off        len   field
//   0          8     magic 89 50 4B 52 0D 0A 1A 0A  ("\x89PKR\r\n\x1a\n")
//   8          2     format_version = 1 or 2
//   10         8     created_at (unix seconds, u64)
//   18         1     threshold k
//   19         1     shares n
//   20         2     set_id (random per ceremony)
//   22         32    hkdf_salt (random)
//   54         32    v1: K_app (random 32-byte key half held by the kit file)
//                    v2: owner commitment
//                      SHA-256("PKRv2 owner-commit" || hkdf_salt || K_app)
//                      — K_app itself lives only on the separate owner key
//   86         12    AES-GCM nonce (random, fresh per encryption)
//   98         32*n  share commitments, i = 1..n:
//                      SHA-256("PKRv1 share-commit" || hkdf_salt || index || share_y)
//   98+32n     4     ct_len (u32)
//   102+32n    var   ciphertext || 16-byte GCM tag
//   end-32     32    file_digest = SHA-256(all preceding bytes)
//
// AAD for the AEAD = bytes 0 .. 102+32n (magic through ct_len): any
// header tamper fails decryption cryptographically (a v2 kit rewritten
// as v1 included — the version bytes are authenticated). The trailing
// digest is the non-cryptographic freshness/bit-rot check ("kit
// fingerprint" = first 4 digest bytes as 8 hex chars).
//
// Decryption key = HKDF-SHA256(salt = hkdf_salt,
//                              IKM  = K_app || K_share  (fixed order),
//                              info = "PKRv1 vault-key", L = 32).
// The derivation is identical in both versions — v2 changes only where
// K_app is stored (bech32m "KEEP1…" owner key instead of offset 54),
// which is why the info string keeps its v1 name.





const FORMAT_VERSION = 1;
const FORMAT_VERSION_OWNER_KEY = 2;
// The tool's compatibility declaration: the vault format versions this
// build can read, carry, and re-wrap into a fresh kit file. A file whose
// version is not listed here is refused rather than guessed at — the
// upgrade path shows this list as the promise it acts on.
const SUPPORTED_FORMAT_VERSIONS = [FORMAT_VERSION, FORMAT_VERSION_OWNER_KEY];
const MIN_CARDS = 2;
const MAX_CARDS = 10;
const MAGIC = Uint8Array.of(0x89, 0x50, 0x4b, 0x52, 0x0d, 0x0a, 0x1a, 0x0a);
const HKDF_INFO = new TextEncoder().encode("PKRv1 vault-key");
const COMMIT_PREFIX = new TextEncoder().encode("PKRv1 share-commit");
const OWNER_COMMIT_PREFIX = new TextEncoder().encode("PKRv2 owner-commit");

class VaultError extends Error {
  constructor(code, message, cardSlot = null) {
    super(message);
    this.name = "VaultError";
    this.code = code;
    // 1-based position of the offending card in the user's input, when known
    this.cardSlot = cardSlot;
  }
}

/**
 * A v1 kit needs at least 2 of 2: with K_app in the file, a single key
 * would make one holder plus any file copy the whole secret. A v2 kit
 * (separate owner key) may go down to 1 of 1 — the owner key is itself
 * a required factor, so even then no holder can act alone.
 */
function validateParams(k, n, separateOwnerKey = false) {
  const minK = separateOwnerKey ? 1 : 2;
  const minN = separateOwnerKey ? 1 : MIN_CARDS;
  if (!Number.isInteger(k) || !Number.isInteger(n)) {
    throw new VaultError("BAD_PARAMS", "k and n must be integers");
  }
  if (k < minK) {
    throw new VaultError("BAD_PARAMS", `threshold must be at least ${minK} ${minK === 1 ? "key" : "keys"}`);
  }
  if (n < minN || n > MAX_CARDS) {
    throw new VaultError("BAD_PARAMS", `number of keys must be ${minN}..${MAX_CARDS}`);
  }
  if (k > n) throw new VaultError("BAD_PARAMS", "threshold cannot exceed the number of keys");
}

async function commitment(salt, index, shareY) {
  const buf = new Uint8Array(COMMIT_PREFIX.length + salt.length + 1 + shareY.length);
  buf.set(COMMIT_PREFIX, 0);
  buf.set(salt, COMMIT_PREFIX.length);
  buf[COMMIT_PREFIX.length + salt.length] = index;
  buf.set(shareY, COMMIT_PREFIX.length + salt.length + 1);
  return sha256(buf);
}

/** Commitment binding a v2 vault to its owner key — identifies a
 *  wrong-but-well-formed owner key before decryption, like the share
 *  commitments do for cards. Safe to store: a preimage over the 256
 *  random bits of K_app. */
async function ownerCommitment(salt, kApp) {
  const buf = new Uint8Array(OWNER_COMMIT_PREFIX.length + salt.length + kApp.length);
  buf.set(OWNER_COMMIT_PREFIX, 0);
  buf.set(salt, OWNER_COMMIT_PREFIX.length);
  buf.set(kApp, OWNER_COMMIT_PREFIX.length + salt.length);
  return sha256(buf);
}

async function deriveKey(salt, kApp, kShare) {
  const ikm = new Uint8Array(64);
  ikm.set(kApp, 0);
  ikm.set(kShare, 32);
  const key = await hkdfSha256(ikm, salt, HKDF_INFO, 32);
  ikm.fill(0);
  return key;
}

// The header is magic through ct_len: exactly the bytes the AEAD
// authenticates. `slot54` is the 32-byte field at offset 54 — K_app in a v1
// vault, the owner commitment in a v2 vault. `ctLen` is known before
// encrypting (padded plaintext + 16-byte tag), so the header can serve as
// the AAD and as the file's first bytes alike.
function buildHeader({ version, createdAt, k, n, setId, salt, slot54, nonce, commitments, ctLen }) {
  const header = new Uint8Array(102 + 32 * n);
  const dv = new DataView(header.buffer);
  header.set(MAGIC, 0);
  dv.setUint16(8, version, true);
  dv.setBigUint64(10, BigInt(createdAt), true);
  header[18] = k;
  header[19] = n;
  header.set(setId, 20);
  header.set(salt, 22);
  header.set(slot54, 54);
  header.set(nonce, 86);
  for (let i = 0; i < n; i++) header.set(commitments[i], 98 + 32 * i);
  dv.setUint32(98 + 32 * n, ctLen, true);
  return header;
}

/** Encrypt under `header` as AAD and lay out the file:
 *  header || ciphertext+tag || SHA-256 of both. */
async function sealVault(key, header, nonce, padded) {
  const ct = await aesGcmSeal(key, nonce, header, padded);
  if (ct.length !== padded.length + 16) {
    throw new Error("internal: unexpected ciphertext length");
  }
  const body = new Uint8Array(header.length + ct.length);
  body.set(header, 0);
  body.set(ct, header.length);
  const bytes = new Uint8Array(body.length + 32);
  bytes.set(body, 0);
  bytes.set(await sha256(body), body.length);
  return bytes;
}

/** The kit fingerprint: the first 4 bytes of the trailing digest, as hex. */
function fingerprintOf(bytes) {
  return toHex(bytes.slice(bytes.length - 32, bytes.length - 28)).toUpperCase();
}

/**
 * The password may arrive as a string or as UTF-8 bytes. Bytes are what the
 * app hands over: a Uint8Array can be zeroed once the ciphertext exists,
 * where a string would linger in the heap until collected. Either way the
 * array returned here is the one that gets wiped — callers passing bytes
 * are handing over ownership of them.
 */
function passwordBytes(password) {
  return typeof password === "string" ? new TextEncoder().encode(password) : password;
}

/**
 * Run a full split ceremony.
 * Returns { bytes, cards, ownerKey, setIdHex, fingerprint, k, n, createdAt }.
 * ("cards" is the internal name for the handwritten key codes.)
 * `randomBytes(len)` supplies ALL randomness (injectable for tests);
 * `createdAt` is unix seconds. With `opts.separateOwnerKey` the vault is
 * written as format v2: K_app is NOT stored in the file — it comes back
 * as the bech32m `ownerKey` string, and recovery needs it alongside the
 * k cards. Without the option (v1) `ownerKey` is null.
 */
async function createVault(password, k, n, randomBytes, createdAt, opts = {}) {
  const separateOwnerKey = Boolean(opts.separateOwnerKey);
  validateParams(k, n, separateOwnerKey);
  const pwBytes = passwordBytes(password);
  const padded = padPassword(pwBytes);

  // the draw order is frozen: the v1 golden vector depends on it, and v2
  // keeps it so the two modes differ only in where K_app ends up
  const kShare = randomBytes(32);
  const kApp = randomBytes(32);
  const salt = randomBytes(32);
  const nonce = randomBytes(12);
  const setId = randomBytes(2);

  const shares = split(kShare, k, n, randomBytes);
  const commitments = [];
  for (const s of shares) commitments.push(await commitment(salt, s.index, s.y));

  const version = separateOwnerKey ? FORMAT_VERSION_OWNER_KEY : FORMAT_VERSION;
  const slot54 = separateOwnerKey ? await ownerCommitment(salt, kApp) : kApp;

  const key = await deriveKey(salt, kApp, kShare);
  const header = buildHeader({
    version, createdAt, k, n, setId, salt, slot54, nonce, commitments, ctLen: padded.length + 16,
  });
  const bytes = await sealVault(key, header, nonce, padded);
  key.fill(0);
  padded.fill(0);
  pwBytes.fill(0);

  const cards = shares.map((s) => encodeCard(s.index, setId, s.y));
  const ownerKey = separateOwnerKey ? encodeOwnerKey(setId, kApp) : null;
  kShare.fill(0);
  kApp.fill(0);
  for (const s of shares) s.y.fill(0);

  return {
    bytes,
    cards,
    ownerKey,
    k,
    n,
    createdAt,
    setIdHex: toHex(setId).toUpperCase(),
    fingerprint: fingerprintOf(bytes),
  };
}

/** Parse + integrity-check PKR bytes. Throws VaultError. */
async function parseVault(bytes) {
  if (bytes.length < 8 || !bytesEqual(bytes.slice(0, 8), MAGIC)) {
    throw new VaultError(
      "BAD_MAGIC",
      "not a PKR vault (file corrupted, possibly by a text-mode copy?)"
    );
  }
  if (bytes.length < 102 + 32 * MIN_CARDS + 16 + 32) {
    throw new VaultError("TRUNCATED", "vault file is truncated");
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const version = dv.getUint16(8, true);
  if (!SUPPORTED_FORMAT_VERSIONS.includes(version)) {
    throw new VaultError("BAD_VERSION", `unsupported vault version ${version}`);
  }
  const createdAt = Number(dv.getBigUint64(10, true));
  const k = bytes[18];
  const n = bytes[19];
  try {
    validateParams(k, n, version === FORMAT_VERSION_OWNER_KEY);
  } catch {
    throw new VaultError("BAD_PARAMS", "vault header has invalid k/n parameters");
  }
  const headerLen = 102 + 32 * n;
  if (bytes.length < headerLen + 16 + 32) {
    throw new VaultError("TRUNCATED", "vault file is truncated");
  }
  const ctLen = dv.getUint32(98 + 32 * n, true);
  if (bytes.length !== headerLen + ctLen + 32) {
    throw new VaultError("TRUNCATED", "vault length does not match its header");
  }
  const digest = await sha256(bytes.slice(0, headerLen + ctLen));
  if (!bytesEqual(digest, bytes.slice(headerLen + ctLen))) {
    throw new VaultError(
      "DIGEST_MISMATCH",
      "vault integrity check failed. This copy is corrupted; try the other USB stick"
    );
  }
  const commitments = [];
  for (let i = 0; i < n; i++) commitments.push(bytes.slice(98 + 32 * i, 98 + 32 * (i + 1)));
  const needsOwnerKey = version === FORMAT_VERSION_OWNER_KEY;
  return {
    version,
    needsOwnerKey,
    createdAt,
    k,
    n,
    setId: bytes.slice(20, 22),
    salt: bytes.slice(22, 54),
    // one 32-byte field, two meanings: the key half itself in v1, only a
    // commitment to it in v2 (the key half is on the separate owner key)
    kApp: needsOwnerKey ? null : bytes.slice(54, 86),
    ownerCommit: needsOwnerKey ? bytes.slice(54, 86) : null,
    nonce: bytes.slice(86, 98),
    commitments,
    aad: bytes.slice(0, headerLen),
    ct: bytes.slice(headerLen, headerLen + ctLen),
    setIdHex: toHex(bytes.slice(20, 22)).toUpperCase(),
    fingerprint: toHex(digest.slice(0, 4)).toUpperCase(),
  };
}

/**
 * Validate one decoded key against a parsed vault.
 * slot is the 1-based input position, used only for error messages.
 */
async function checkCard(vault, key, slot) {
  if (!bytesEqual(key.setId, vault.setId)) {
    throw new VaultError(
      "SET_MISMATCH",
      `key in slot ${slot} is from a different key set (kit expects set ${vault.setIdHex})`,
      slot
    );
  }
  if (key.index < 1 || key.index > vault.n) {
    throw new VaultError("BAD_INDEX", `key in slot ${slot} has index ${key.index}, kit has only ${vault.n} keys`, slot);
  }
  const expected = vault.commitments[key.index - 1];
  const actual = await commitment(vault.salt, key.index, key.shareY);
  if (!bytesEqual(expected, actual)) {
    throw new VaultError(
      "COMMITMENT_MISMATCH",
      `key in slot ${slot} is valid text but does not belong to this vault file`,
      slot
    );
  }
}

/**
 * Validate a decoded owner key ({ setId, kApp }) against a parsed v2 vault.
 * Exported so entry fields can validate live, like checkCard for cards.
 */
async function checkOwnerKey(vault, owner) {
  if (!vault.needsOwnerKey) {
    throw new VaultError("OWNER_NOT_NEEDED", "this kit stores its own key half; it takes no owner's key");
  }
  if (!bytesEqual(owner.setId, vault.setId)) {
    throw new VaultError(
      "OWNER_SET_MISMATCH",
      `the owner's key is from a different key set (kit expects set ${vault.setIdHex})`
    );
  }
  const actual = await ownerCommitment(vault.salt, owner.kApp);
  if (!bytesEqual(vault.ownerCommit, actual)) {
    throw new VaultError(
      "OWNER_KEY_MISMATCH",
      "the owner's key is valid text but does not belong to this vault file"
    );
  }
}

/** The K_app to derive with: the vault's own in v1, the verified owner
 *  key's in v2. Both a missing owner key (v2) and a surplus one (v1) are
 *  the caller's error — silently ignoring key material would hide bugs. */
async function resolveKApp(vault, owner) {
  if (!vault.needsOwnerKey) {
    if (owner) {
      throw new VaultError("OWNER_NOT_NEEDED", "this kit stores its own key half; it takes no owner's key");
    }
    return vault.kApp;
  }
  if (!owner) {
    throw new VaultError("NEED_OWNER_KEY", "this kit needs the owner's key as well as the keys");
  }
  await checkOwnerKey(vault, owner);
  return owner.kApp;
}

/**
 * The vault key from exactly k keys (and, for a v2 vault, the owner key):
 * each key's membership is checked before duplicates, so a foreign key
 * says "wrong set" rather than "entered twice" even when its index collides
 * with a valid one. The caller owns the returned key and must zero it.
 */
async function vaultKeyFrom(vault, keys, owner) {
  if (keys.length !== vault.k) {
    throw new VaultError("NEED_K", `exactly ${vault.k} keys are required, got ${keys.length}`);
  }
  const kApp = await resolveKApp(vault, owner);
  const seen = new Set();
  for (let i = 0; i < keys.length; i++) {
    await checkCard(vault, keys[i], i + 1);
    if (seen.has(keys[i].index)) {
      throw new VaultError("DUPLICATE", `the same key was entered twice (key ${keys[i].index})`, i + 1);
    }
    seen.add(keys[i].index);
  }
  const kShare = combine(keys.map((c) => ({ index: c.index, y: c.shareY })));
  const key = await deriveKey(vault.salt, kApp, kShare);
  kShare.fill(0);
  return key;
}

/**
 * Recover the password as UTF-8 bytes. The caller owns the array and should
 * zero it once done: bytes can be wiped, the string a decode would produce
 * cannot. `recoverPassword` below is the string form, for callers that have
 * to hand the value to something text-shaped. A v2 vault additionally needs
 * `owner`, the decoded owner key ({ setId, kApp }).
 */
async function recoverPasswordBytes(vault, keys, owner = null) {
  const key = await vaultKeyFrom(vault, keys, owner);
  let padded;
  try {
    padded = await aesGcmOpen(key, vault.nonce, vault.aad, vault.ct);
  } catch {
    throw new VaultError(
      "AEAD_FAIL",
      "keys verified but decryption failed. The vault file is damaged; try the other USB stick"
    );
  } finally {
    key.fill(0);
  }
  const pw = unpadPassword(padded);
  padded.fill(0);
  return pw;
}

/** Recover the password as a string. */
async function recoverPassword(vault, keys, owner = null) {
  const pw = await recoverPasswordBytes(vault, keys, owner);
  const text = new TextDecoder().decode(pw);
  pw.fill(0);
  return text;
}

/**
 * Rotation: same key set, new password. Requires k valid keys (proves
 * possession), keeps K_app/salt/set_id/commitments, draws a fresh nonce.
 * A v2 vault additionally needs `owner` — the same owner key stays valid
 * afterwards, since the vault keeps its commitment.
 */
async function rotateVault(vault, keys, newPassword, randomBytes, createdAt, owner = null) {
  const key = await vaultKeyFrom(vault, keys, owner);
  const pwBytes = passwordBytes(newPassword);
  const padded = padPassword(pwBytes);
  const nonce = randomBytes(12);
  const header = buildHeader({
    version: vault.version,
    createdAt,
    k: vault.k,
    n: vault.n,
    setId: vault.setId,
    salt: vault.salt,
    slot54: vault.needsOwnerKey ? vault.ownerCommit : vault.kApp,
    nonce,
    commitments: vault.commitments,
    ctLen: padded.length + 16,
  });
  const bytes = await sealVault(key, header, nonce, padded);
  key.fill(0);
  padded.fill(0);
  pwBytes.fill(0);
  return {
    bytes,
    k: vault.k,
    n: vault.n,
    createdAt,
    setIdHex: vault.setIdHex,
    fingerprint: fingerprintOf(bytes),
  };
}

// Every published KEEP release before this one, oldest first. This is what
// lets a newer keep.html vouch for a RECOVERY.html made years earlier: undo
// the kit's two swaps (kitfile.js) and the hash of what is left must be one
// of these.
//
//   keep  SHA-256 of the release's blank keep.html, exactly as published
//         in its README (and so as committed in dist/keep.html at its tag).
//         Since 1.1.0 a kit's code hashes to this value too.
//   kit   only for 1.0.x: those kits were written from the browser's
//         re-serialized copy of the page, which differs from the published
//         file in a few spots (whitespace around the header comment, the
//         wrapped CSP tag, the licence after the script), so their code
//         hashes to the serialized form instead. Recorded from Chrome.
//
// A build cannot list itself: its own hash is only known once it is built.
// When version N+1 is prepared, N's published hash goes here; the test suite
// (test/kitfile.test.mjs) fails until every earlier v* tag is listed.
//
// No v1.0.1: that release was withdrawn and its tag retired.

const KNOWN_RELEASES = [
  {
    version: "1.0.0",
    keep: "c88925e2a45ef08cff2c4939ce40f0748da51cd0372378b5c3b9867246240dc2",
    kit: "3bad02c2f6f276c643981d09ade8ca392d2dbad9e4efcab5404a5cbf312460c9",
  },
  {

  {

    kit: "7709b8fc9de75db582e7c424d737d22a7b8f857adc42952a81d4a557dc3d5780",

/* ===== src/kitfile.js ===== */
// The kit file as text. A personalized RECOVERY.html is the blank tool with
// exactly two spans swapped: the vault block's payload ("null" becomes the
// base64 vault) and the <title>. Since 1.1.0 the page is written so that the
// browser's copy of it is byte-identical to the file, which makes the swap
// reversible: undo both spans and a genuine kit turns back into the exact
// published keep.html, whose hash anyone can look up. This module owns that
// round trip and the release lookup built on it — plain text in, text out,
// so node tests reach it without a browser.
//
// Like app.js, nothing here may contain a literal script tag (it would end
// the inline script), and no string or comment may spell out the version
// declaration that claimedVersion() looks for.




const BLANK_TITLE = "KEEP — Create Recovery Kit";
const RECOVERY_TITLE = "KEEP — Recovery";

const VAULT_BLOCK = new RegExp(
  "(<scr" + 'ipt type="application/json" id="pkr-vault">)([\\s\\S]*?)(</scr' + "ipt>)"
);
const TITLE = /<title>[^<]*<\/title>/;
const VERSION_DECLARATION = /^const APP_VERSION = "(KEEP [^"]*)";$/m;

class KitFileError extends Error {
  constructor(code, message) {
    super(message);
    this.name = "KitFileError";
    this.code = code;
  }
}

function swap(source, payload, title) {
  if (!VAULT_BLOCK.test(source)) {
    throw new KitFileError("NO_VAULT_BLOCK", "This file is not a KEEP file — it has no vault block inside it.");
  }
  if (!TITLE.test(source)) {
    throw new KitFileError("NO_TITLE", "This file is not a KEEP file — it has no title.");
  }
  // function replacers: a payload is inserted verbatim, never read as a
  // replacement pattern
  return source
    .replace(VAULT_BLOCK, (_, open, _old, close) => open + payload + close)
    .replace(TITLE, () => `<title>${title}</title>`);
}

/** The personalized kit: `source` (the tool, blank or a kit) carrying `b64`.
 *  Rewriting rather than appending keeps it idempotent, so a kit can
 *  regenerate itself during rotation. */
function withVault(source, b64) {
  return swap(source, b64, RECOVERY_TITLE);
}

/** The blank tool a kit file was made from: both swaps undone. A blank
 *  tool comes back unchanged. */
function blankForm(source) {
  return swap(source, "null", BLANK_TITLE);
}

/** The base64 vault inside a file, or null when the file is a blank tool. */
function vaultPayload(text) {
  const m = text.match(VAULT_BLOCK);
  if (!m) {
    throw new KitFileError("NO_VAULT_BLOCK", "This file is not a KEEP file — it has no vault block inside it.");
  }
  const b64 = m[2].trim();
  return b64 && b64 !== "null" ? b64 : null;
}

/** The version a file says it is ("KEEP 1.1.0"), or null. A claim only:
 *  whoever changed the code could change this line too. Anchored to the
 *  declaration at the start of a line, the shape every build carries. */
function claimedVersion(text) {
  const m = text.match(VERSION_DECLARATION);
  return m ? m[1] : null;
}

/** Order two "KEEP x.y[.z]" (or bare "x.y.z") stamps: negative, zero or
 *  positive like a sort comparator; null when either is unreadable. */
function compareVersions(a, b) {
  const parts = (s) => {
    const m = /^(?:KEEP )?(\d+)\.(\d+)(?:\.(\d+))?$/.exec(s ?? "");
    return m ? [Number(m[1]), Number(m[2]), Number(m[3] ?? 0)] : null;
  };
  const pa = parts(a);
  const pb = parts(b);
  if (!pa || !pb) return null;
  for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
  return 0;
}

/** SHA-256 (hex) of a file's blank form: the identity of its app code. */
async function codeDigest(text) {
  return toHex(await sha256(new TextEncoder().encode(blankForm(text))));
}

/**
 * Name the app code inside a KEEP file by its hash alone. `selfDigest` is
 * the running build's own code digest, since no build can list itself.
 * Returns { digest, claimed, kind, release }, where kind is
 *   "self"     the same code as the tool doing the checking
 *   "release"  a published release from `releases` (then `release` is set)
 *   "unknown"  neither: changed code, a development build, or a release
 *              newer than this tool
 */
async function identifyCode(text, selfDigest, releases = KNOWN_RELEASES) {
  const digest = await codeDigest(text);
  const claimed = claimedVersion(text);
  if (digest === selfDigest) return { digest, claimed, kind: "self", release: null };
  const release = releases.find((r) => r.keep === digest || r.kit === digest) ?? null;
  return { digest, claimed, kind: release ? "release" : "unknown", release };
}

/* ===== src/selftest.js ===== */
// Built-in self-test: known-answer tests for every primitive plus a
// full split -> encode -> decode -> combine -> decrypt round trip.
// Runs identically under node:test and behind the app's Self-test view;
// the letter tells recoverers to run it before anything else.







function combinations(arr, k) {
  if (k === 0) return [[]];
  if (arr.length < k) return [];
  const [head, ...rest] = arr;
  return [
    ...combinations(rest, k - 1).map((c) => [head, ...c]),
    ...combinations(rest, k),
  ];
}

const CHECKS = [
  {
    name: "GF(256) Field Arithmetic",
    detail: "AES-field products and inverses match known answers",
    async run() {
      // classic AES-field products and inverses
      if (gfMul(0x53, 0xca) !== 0x01) throw new Error("0x53*0xCA != 1");
      if (gfMul(0x57, 0x83) !== 0xc1) throw new Error("0x57*0x83 != 0xC1");
      if (gfInv(0x53) !== 0xca) throw new Error("inv(0x53) != 0xCA");
      for (let a = 1; a < 256; a++) {
        if (gfMul(a, gfInv(a)) !== 1) throw new Error(`a*inv(a) != 1 for a=${a}`);
      }
      if (polyEval([5, 3, 2], 0) !== 5) throw new Error("polyEval constant term");
    },
  },
  {
    name: "SHA-256 Known Answer",
    detail: "SHA-256 of \"abc\" matches the published digest",
    async run() {
      const d = await sha256(new TextEncoder().encode("abc"));
      const want = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad";
      if (toHex(d) !== want) throw new Error("SHA-256(abc) mismatch");
    },
  },
  {
    name: "HKDF-SHA256 RFC 5869 Test Case 1",
    detail: "Key derivation matches the RFC test vector",
    async run() {
      const okm = await hkdfSha256(
        fromHex("0b".repeat(22)),
        fromHex("000102030405060708090a0b0c"),
        fromHex("f0f1f2f3f4f5f6f7f8f9"),
        42
      );
      const want =
        "3cb25f25faacd57a90434f64d0362f2a" +
        "2d2d0a90cf1a5a4c5db02d56ecc4c5bf" +
        "34007208d5b887185865";
      if (toHex(okm) !== want) throw new Error("HKDF OKM mismatch");
    },
  },
  {
    name: "AES-256-GCM NIST Known Answer",
    detail: "Encryption matches the NIST vector",
    async run() {
      const out = await aesGcmSeal(
        new Uint8Array(32),
        new Uint8Array(12),
        new Uint8Array(0),
        new Uint8Array(16)
      );
      const want =
        "cea7403d4d606b6e074ec5d3baf39d18" + "d0d1c8a799996bf0265b98b5d48ab919";
      if (toHex(out) !== want) throw new Error("AES-GCM vector mismatch");
    },
  },
  {
    name: "Bech32m BIP-350 Vectors",
    detail: "Reference codes round-trip; a corrupted one is rejected",
    async run() {
      const valid = [
        "a1lqfn3a",
        "abcdef1l7aum6echk45nj3s0wdvt2fg8x9yrzpqzd3ryx",
        "split1checkupstagehandshakeupstreamerranterredcaperredlc445v",
      ];
      for (const v of valid) {
        const { hrp, data } = bech32mDecode(v);
        if (bech32mEncode(hrp, data) !== v) throw new Error(`re-encode mismatch for ${v}`);
      }
      let threw = false;
      try {
        bech32mDecode("a1lqfn33"); // corrupted last char
      } catch {
        threw = true;
      }
      if (!threw) throw new Error("corrupted string accepted");
    },
  },
  {
    name: "Key Encode/Decode Round Trip",
    detail: "A key survives upper case and added spaces",
    async run() {
      const setId = Uint8Array.of(0xa7, 0xf2);
      const share = Uint8Array.from({ length: 32 }, (_, i) => (i * 7 + 3) & 0xff);
      const key = encodeCard(3, setId, share);
      if (key.length !== CARD_LENGTH) throw new Error(`key length ${key.length}`);
      const dec = decodeCard(key.toUpperCase().replace(/(.{4})/g, "$1 "));
      if (dec.index !== 3 || !bytesEqual(dec.setId, setId) || !bytesEqual(dec.shareY, share)) {
        throw new Error("decoded key differs");
      }
    },
  },
  {
    name: "Shamir Split/Combine (3-of-5, All 10 Combos)",
    detail: "Every three-key combination returns the secret",
    async run() {
      const secret = randomBytes(32);
      const shares = split(secret, 3, 5, randomBytes);
      for (const combo of combinations(shares, 3)) {
        if (!bytesEqual(combine(combo), secret)) throw new Error("combo failed to recover");
      }
    },
  },
  {
    name: "Full Ceremony Round Trip (Dummy Secret)",
    detail: "A sample kit recovers; any two keys are refused",
    async run() {
      const password = "self-test dummy pässword ✓";
      const { bytes, cards } = await createVault(password, 3, 5, randomBytes, 1_700_000_000);
      const vault = await parseVault(bytes);
      const decoded = cards.map((c) => decodeCard(c));
      for (const combo of combinations(decoded, 3)) {
        const got = await recoverPassword(vault, combo);
        if (got !== password) throw new Error("recovered password differs");
      }
      // k-1 keys must be refused
      let refused = false;
      try {
        await recoverPassword(vault, decoded.slice(0, 2));
      } catch {
        refused = true;
      }
      if (!refused) throw new Error("k-1 keys were not refused");
    },
  },
  {
    name: "Owner's-Key Kit Round Trip (Dummy Secret)",
    detail: "A v2 kit needs its owner's key; wrong or missing keys are refused",
    async run() {
      const password = "self-test v2 dummy pässword ✓";
      const { bytes, cards, ownerKey } = await createVault(
        password, 3, 5, randomBytes, 1_700_000_000, { separateOwnerKey: true }
      );
      const vault = await parseVault(bytes);
      if (!vault.needsOwnerKey) throw new Error("v2 vault not flagged as needing the owner key");
      const owner = decodeOwnerKey(ownerKey);
      const decoded = cards.map((c) => decodeCard(c));
      for (const combo of combinations(decoded, 3)) {
        const got = await recoverPassword(vault, combo, owner);
        if (got !== password) throw new Error("recovered password differs");
      }
      // without the owner key the same k cards must be refused
      let refused = false;
      try {
        await recoverPassword(vault, decoded.slice(0, 3));
      } catch {
        refused = true;
      }
      if (!refused) throw new Error("missing owner's key was not refused");
      // a foreign owner key must be named as wrong before decryption
      const other = await createVault("x", 3, 5, randomBytes, 1_700_000_000, { separateOwnerKey: true });
      refused = false;
      try {
        await recoverPassword(vault, decoded.slice(0, 3), decodeOwnerKey(other.ownerKey));
      } catch {
        refused = true;
      }
      if (!refused) throw new Error("foreign owner's key was not refused");
    },
  },
];

/** Names and one-line descriptions, for a UI that lists the checks
 *  before they have run. Same order as the results. */
const SELF_TEST_CHECKS = CHECKS.map((c) => ({ name: c.name, detail: c.detail }));

/**
 * Run all checks; returns [{ name, detail, ok, error, ms }]. Never throws.
 * `onResult(result, index)` is awaited after each check, so a UI can show
 * progress while the run is still going. `extraChecks` ({ name, detail,
 * run }) run after the built-in ones: the app adds what only a page can
 * check, such as how the browser copies the file.
 */
async function runSelfTest(onResult, extraChecks = []) {
  const all = [...CHECKS, ...extraChecks];
  const results = [];
  for (let i = 0; i < all.length; i++) {
    const check = all[i];
    const started = Date.now();
    let result;
    try {
      await check.run();
      result = { name: check.name, detail: check.detail, ok: true, error: null, ms: 0 };
    } catch (err) {
      result = {
        name: check.name,
        detail: check.detail,
        ok: false,
        error: String(err?.message ?? err),
        ms: 0,
      };
    }
    result.ms = Date.now() - started;
    results.push(result);
    if (onResult) await onResult(result, i);
  }
  return results;
}

/* ------------------------------------------------------------------ */
/* the key mark — teeth cut from the live parameters                   */
/* ------------------------------------------------------------------ */

/** Mean of every part's travel, so the exploded key stays centred. */
function markSpread(total) {
  let sum = -5.4;
  for (let i = 0; i < total; i++) sum += 2.4 + i * 2.6;
  return sum / (total + 1);
}

/**
 * Long tooth = a key that counts toward the threshold, short = spare.
 * The familiar tail (…short, long, long) is kept whenever the numbers
 * allow. Tooth size and pitch are fixed: more keys make the key longer,
 * not the teeth bigger.
 */
function cutKey(total, needed) {
  const pattern = [];
  let longs = needed;
  let shorts = total - needed;
  const tail = total >= 3 && longs >= 2 && shorts >= 1 ? ["s", "l", "l"] : null;
  if (tail) { shorts -= 1; longs -= 2; }
  const leadCount = total - (tail ? 3 : 0);
  let want = "s";
  for (let i = 0; i < leadCount; i++) {
    const pick = want === "s" ? (shorts > 0 ? "s" : "l") : (longs > 0 ? "l" : "s");
    pattern.push(pick);
    if (pick === "s") shorts--; else longs--;
    want = pick === "s" ? "l" : "s";
  }
  if (tail) pattern.push(...tail);
  else for (let i = pattern.length; i < total; i++) pattern.push(longs-- > 0 ? "l" : "s");

  const first = 9.6;
  const w = 2.5;
  const pitch = 2.95;
  return pattern.map((p, i) => ({
    x: +(first + i * pitch).toFixed(2),
    w,
    h: p === "l" ? 9.2 : 4.6,
    op: p === "l" ? 1 : 0.28,
    dx: (2.4 + i * 2.6 - markSpread(total)).toFixed(2) + "px",
    ed: 18 + i * 18 + "ms",
    rd: (total - 1 - i) * 18 + "ms",
  }));
}

/** The bow (the circle — the part of a key that stays in your hand) reads
 *  like the teeth do: dimmed like a spare while the owner's key half sits
 *  buried inside the kit file, full amber once it is a separate owner's key
 *  the owner actually holds. */
function markMarkup(total, needed, ownerSeparate = false) {
  const teeth = cutKey(total, needed);
  const width = Math.round((9.6 + total * 2.95 - 1.2) * (42 / 23.15));
  const box = "0.75 0 " + (9.6 + total * 2.95 - 0.75 - 0.45).toFixed(2) + " 24";
  const bowDx = (-5.4 - markSpread(total)).toFixed(2) + "px";
  const bowOp = ownerSeparate ? 1 : 0.28;
  let out =
    '<svg class="kmark" width="' + width + '" height="42" viewBox="' + box + '" aria-hidden="true">' +
    '<g class="kp" style="--dx:' + bowDx + ';--ed:0ms;--rd:' + total * 18 + 'ms">' +
    '<circle class="kb" cx="4.4" cy="10" r="3" fill="none" stroke="#ffb000" stroke-width="2.6" opacity="' + bowOp + '"></circle>' +
    "</g><g fill=\"#ffb000\">";
  for (const t of teeth) {
    out +=
      '<g class="kp" style="--dx:' + t.dx + ";--ed:" + t.ed + ";--rd:" + t.rd + '">' +
      '<rect class="kb" x="' + t.x + '" y="8.4" width="' + t.w + '" height="' + t.h +
      '" opacity="' + t.op + '"></rect></g>';
  }
  return out + "</g></svg>";
}

/**
 * Explode on enter, reassemble on leave, with a dock-style gaussian
 * falloff while the pointer is over it: parts near the cursor step
 * aside, so the one you point at stands alone.
 */
function wireMark(mark) {
  const shapes = [...mark.querySelectorAll(".kb")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SIGMA = 11;
  const SPREAD = 14;
  const NORM = Math.exp(-0.5);
  const rest = () => shapes.forEach((s) => s.style.setProperty("--mx", "0px"));
  let raf = 0;
  let mx = 0;
  function paint() {
    raf = 0;
    const ratio = 23.15 / mark.getBoundingClientRect().width;
    for (const s of shapes) {
      const r = s.getBoundingClientRect();
      const d = mx - (r.left + r.width / 2);
      const g = Math.exp(-(d * d) / (2 * SIGMA * SIGMA));
      s.style.setProperty("--mx", (-(d / SIGMA) * g / NORM * SPREAD * ratio).toFixed(2) + "px");
    }
  }
  mark.addEventListener("pointerenter", () => {
    mark.classList.remove("is-in");
    mark.classList.add("is-out");
  });
  mark.addEventListener("pointermove", (e) => {
    if (reduce || !mark.classList.contains("is-out")) return;
    mx = e.clientX;
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  mark.addEventListener("pointerleave", () => {
    mark.classList.remove("is-out");
    mark.classList.add("is-in");
    cancelAnimationFrame(raf);
    raf = 0;
    rest();
  });
}

 * The rail has two moods: during the ceremony it is a numbered progress
 * list, inside a kit it is navigation. The key mark sits at the bottom

    ? el("button", { class: "kword link", type: "button", onclick: spec.home })

let CEREMONY_LIVE = false;

function leaveCeremonyMessage() {

    home: CEREMONY_LIVE ? confirmLeaveCeremony : showHome,

/* ------------------------------------------------------------------ */
/* view plumbing                                                       */
/* ------------------------------------------------------------------ */

let viewTimers = [];
let viewResize = null;
let viewCleanups = [];

/** Overlay scrollbar for a box inside the current view. Mounted on the next
 *  frame: views are built before render() runs, and render is what flushes
 *  the previous view's cleanups — attaching after it keeps this one alive. */
function mountBoxScrollbar(scrollNode, host) {
  // setTimeout, not rAF: frames stall in hidden tabs, and the ordering only
  // needs to be "after the render() that mounts this view"
  setTimeout(() => {
    const sb = createEdgeScrollbar(scrollNode, host);
    viewCleanups.push(sb.destroy);
    viewInterval(sb.update, 150); // safety net for growth nothing observes
  }, 0);
}

/** A resize listener that lives only as long as the current view. */
function onViewResize(fn) {
  viewResize = fn;
  window.addEventListener("resize", fn);
}

/** setTimeout/setInterval bound to the current view; cleared on the next. */
function viewTimeout(fn, ms) {
  const id = setTimeout(fn, ms);
  viewTimers.push([id, clearTimeout]);
  return id;
}
function viewInterval(fn, ms) {
  const id = setInterval(fn, ms);
  viewTimers.push([id, clearInterval]);
  return id;
}

function render(rail, ...nodes) {
  for (const [id, clear] of viewTimers) clear(id);
  viewTimers = [];
  for (const fn of viewCleanups) fn();
  viewCleanups = [];
  if (viewResize) { window.removeEventListener("resize", viewResize); viewResize = null; }
  for (const layer of document.querySelectorAll(".modal")) layer.remove();
  // the tab follows the view: every screen names itself through its rail spec,
  // so a screen that forgets falls back to the bare wordmark rather than
  // leaving the previous screen's name behind
  document.title = rail && rail.page ? `KEEP — ${rail.page}` : "KEEP";
  renderRail(rail);
  appRoot.replaceChildren(el("div", { class: "view" }, nodes));
  window.scrollTo(0, 0);
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30_000);
}

function downloadHtml(content, filename) {
  downloadBlob(content, filename, "text/html");
}

function downloadText(content, filename) {
  downloadBlob(content, filename, "text/plain");
}

/** Confirmation sheet over the screen, with a countdown on the action. */
function confirmModal(message, actionLabel, onConfirm, seconds = 3) {
  let left = seconds;
  const action = goBtn(`${actionLabel} (${left})`, () => {
    if (left > 0) return;
    close();
    onConfirm();
  }, false);
  const backBtn = btn("BACK", () => close());
  const layer = el("div", { class: "modal" }, el("div", { class: "msheet" }, [
    el("p", { class: "mtext" }, [].concat(message)),
    el("div", { class: "btnrow" }, [backBtn, action]),
  ]));
  const tick = setInterval(() => {
    left -= 1;
    action.firstChild.textContent = left > 0 ? `${actionLabel} (${left})` : actionLabel;
    if (left <= 0) { clearInterval(tick); setEnabled(action, true); }
  }, 1000);
  function close() {
    clearInterval(tick);
    layer.remove();
  }
  document.body.append(layer);
}

/** Unique ids so every control can be tied to its own visible label. */
let uidSeq = 0;
function uid(prefix) {

      id,
      type: "text", class: "fieldin", placeholder,
      autocomplete: "off", spellcheck: "false", autocapitalize: "none",
    });
  const toggle = el("button", { class: "btn btn-go", type: "button", text: "SHOW" });

  /** What may enter the buffer: multi-line text keeps newlines (normalised
   *  to LF); a single-line secret never contains one, so the recovery
   *  screen can trust newline-presence as the "large secret" signal. */
  function sanitize(text) {
    return multiline ? text.replace(/\r\n?/g, "\n") : text.replace(/[\r\n]+/g, "");
  }

  function masked() {
    let out = "";
    for (let i = 0; i < real.length; i++) {
      const ch = real.charAt(i);
      out += ch === "\n" ? "\n" : i === peekPos ? ch : "•";
    }
    return out;
  }
  function refresh(caret) {
    input.value = revealed || composing ? real.reveal() : masked();
    if (caret !== undefined) input.setSelectionRange(caret, caret);
  }
  function changed() {
    input.dispatchEvent(new Event("secretchange"));
  }

  input.addEventListener("beforeinput", (e) => {
    if (revealed || composing) return; // plaintext mode, synced on input
    const t = e.inputType || "";
    if (t === "insertCompositionText") return; // handled via composition events
    const start = input.selectionStart ?? 0;
    const end = input.selectionEnd ?? start;
    let ins = "";
    if (t === "insertLineBreak" || t === "insertParagraph") ins = "\n";
    else if (t.startsWith("insert")) ins = e.data ?? (e.dataTransfer?.getData("text") ?? "");
    ins = sanitize(ins);
    let s = start;
    let epos = end;
    if (t === "deleteContentBackward" && start === end) s = Math.max(0, start - 1);
    else if (t === "deleteContentForward" && start === end) epos = Math.min(real.length, end + 1);
    else if (!t.startsWith("insert") && !t.startsWith("delete")) {
      e.preventDefault(); // undo/history would desync the mask
      return;
    }
    e.preventDefault();
    const added = real.splice(s, epos, ins);
    clearTimeout(peekTimer);
    peekPos = added === 1 ? s : -1;
    refresh(s + added);
    if (peekPos >= 0) {
      peekTimer = setTimeout(() => {
        peekPos = -1;
        refresh(input === document.activeElement ? input.selectionStart : undefined);
      }, 850);
    }
    changed();
  });
  input.addEventListener("input", () => {
    if (revealed || composing) { real.setFrom(sanitize(input.value)); changed(); }
  });
  input.addEventListener("compositionstart", () => {
    composing = true;
    refresh(real.length);
  });
  input.addEventListener("compositionend", () => {
    composing = false;
    real.setFrom(sanitize(input.value));
    refresh(real.length);
    changed();
  });
  toggle.addEventListener("click", () => {
    // keep the reader's place: caret and scroll survive the mask flip
    // instead of jumping to the end of the text
    const caret = input.selectionStart ?? input.value.length;
    const scroll = input.scrollTop;
    revealed = !revealed;
    toggle.textContent = revealed ? "HIDE" : "SHOW";
    clearTimeout(peekTimer);
    peekPos = -1;
    refresh(Math.min(caret, revealed ? real.reveal().length : real.length));
    input.focus();
    input.scrollTop = scroll;
  });

  let fieldNode = input;
  if (multiline) {
    // the overlay scrollbar needs a positioned wrapper riding the box edge
    fieldNode = el("div", { class: "scrollhost" }, [input]);
    mountBoxScrollbar(input, fieldNode);
  }

  return {
    node: el("div", { class: "frow" }, [fieldNode, toggle]),
    id,
    /** UTF-8 bytes of what was typed; the caller owns them and must zero
     *  them (or hand them to something that does). */
    bytes: () => real.bytes(),
    byteLength: () => real.byteLength(),
    length: () => real.length,
    isEmpty: () => real.length === 0,
    /** Compare two fields without either value becoming a string. */
    matches: (other) => other.sameAs(real),
    sameAs: (buffer) => real.equals(buffer),
    clear: () => {
      real.clear();
      peekPos = -1;
      revealed = false;
      toggle.textContent = "SHOW";
      refresh();
    },
    onChange: (fn) => input.addEventListener("secretchange", fn),
  };
}

function labelledSecret(labelText, placeholder, multiline = false) {
  const field = secretField(placeholder, multiline);
  return {
    ...field,
    block: el("div", { class: "field" }, [
      // a real label bound to the input: the caption was only visually
      // adjacent before, which left the field unlabelled to a screen reader
      el("label", { class: "flabel", for: field.id, text: labelText }),
      field.node,
    ]),
  };
}

/**
 * The enter-twice secret pair, with a size switch: a single-line box for a
 * password, a multi-line one for anything bigger — instructions to go with
 * the password, and the like. Switching sizes rebuilds both fields (wiping
 * the old buffers first: a discarded field must not keep a secret) and the
 * choice needs no header flag anywhere — a multi-line secret carries its
 * newlines inside the ciphertext, and the recovery screen sizes itself from
 * those.
 */
function secretPair(firstLabel, againLabel, onChange, onMode) {
  let multiline = false;
  let first = null;
  let again = null;
  const holder = el("div", { class: "secretfields" });

  const tabLine = el("button", { class: "tab on", type: "button", text: "SINGLE LINE" });
  const tabBlock = el("button", { class: "tab", type: "button", text: "MULTIPLE LINES" });
  // the same tab strip the print screen uses: it sits directly on the rule
  // below it, and switching swaps only what the choice concerns
  const tabs = el("div", { class: "tabs" }, [tabLine, tabBlock]);

  function build() {
    if (first) { first.clear(); again.clear(); }
    first = labelledSecret(firstLabel, "Type or paste it here", multiline);
    again = labelledSecret(againLabel, "Type it a second time", multiline);
    first.onChange(onChange);
    again.onChange(onChange);
    holder.replaceChildren(first.block, again.block);
    onChange();
  }

  function pick(wantMultiline) {
    if (wantMultiline === multiline) return;
    multiline = wantMultiline;
    tabLine.className = multiline ? "tab" : "tab on";
    tabBlock.className = multiline ? "tab on" : "tab";
    tabLine.setAttribute("aria-pressed", String(!multiline));
    tabBlock.setAttribute("aria-pressed", String(multiline));
    build();
    if (onMode) onMode(multiline);
  }
  tabLine.setAttribute("aria-pressed", "true");
  tabBlock.setAttribute("aria-pressed", "false");
  tabLine.addEventListener("click", () => pick(false));
  tabBlock.addEventListener("click", () => pick(true));
  build();

  return {
    tabs,
    fields: holder,
    // the live fields, so callers always talk to the current size
    get first() { return first; },
    get again() { return again; },
  };
}

/**
 * Live-validated key entry: `count` textareas checked against `vault`
 * on every keystroke — checksum, set, commitment, and cross-slot
 * duplicates. A slot repeating an earlier slot's key is marked invalid,
 * so the submit button never enables for duplicate keys. Nothing is
 * judged until the entry is as long as a real key.
 */
function keyEntryPanel(vault, count, onChange, placeholder = "Type a key here") {
  const slots = Array.from({ length: count }, (_, i) => {
    const id = uid("key");
    const input = el("textarea", {
      id,
      class: "fieldin", rows: "3", placeholder,
      autocomplete: "off", spellcheck: "false", autocapitalize: "none",
    });
    const noteBox = note("blank", "");
    return {
      input,
      noteBox,
      block: el("div", { class: "field" }, [
        el("label", { class: "flabel", for: id, text: `KEY ${i + 1}` }),
        input,
        noteBox,
      ]),
      decoded: null,
      ok: false,
    };
  });
  let generation = 0;

  function paint(slot, kind, content) {
    slot.noteBox.className = `note note-${kind}`;
    slot.noteBox.replaceChildren(
      ...(kind === "blank" ? [] : [icon(NOTE_ICON[kind])]),
      el("span", {}, [].concat(content))
    );
    slot.input.classList.toggle("is-ok", kind === "ok");
    slot.input.classList.toggle("is-bad", kind === "bad");
  }

  async function validateAll() {
    const gen = ++generation;
    const results = [];
    for (const slot of slots) {
      const typed = normalizeCardInput(slot.input.value);
      if (typed.length < CARD_LENGTH) {
        results.push({ decoded: null, error: null });
        continue;
      }
      let dec = null;
      try {
        dec = decodeCard(typed);
        await checkCard(vault, dec, 1);
        results.push({ decoded: dec, error: null });
      } catch (err) {
        // the note sits under its own field, so a wrong set gets the
        // full diagnosis rather than the slot-numbered error text
        results.push({
          decoded: null,
          error: err.code === "SET_MISMATCH" && dec
            ? wrongSetMessage(toHex(dec.setId).toUpperCase(), vault.setIdHex)
            : err.message,
        });
      }
    }
    if (gen !== generation) return; // superseded by newer input
    const firstSlotByIndex = new Map();
    slots.forEach((slot, i) => {
      const r = results[i];
      slot.decoded = null;
      slot.ok = false;
      if (r.decoded === null && r.error === null) { paint(slot, "blank", ""); return; }
      if (r.error !== null) { paint(slot, "bad", r.error); return; }
      const prev = firstSlotByIndex.get(r.decoded.index);
      if (prev !== undefined) {
        paint(slot, "bad", `That key is already entered, in slot ${prev + 1}.`);
        return;
      }
      firstSlotByIndex.set(r.decoded.index, i);
      slot.decoded = r.decoded;
      slot.ok = true;
      paint(slot, "ok", `Key #${r.decoded.index}`);
    });
    onChange();
  }

  for (const slot of slots) slot.input.addEventListener("input", validateAll);

  return {
    fields: slots.map((s) => s.block),
    allValid: () => slots.every((s) => s.ok),
    decoded: () => slots.map((s) => s.decoded),
    clear: () => {
      for (const s of slots) { s.input.value = ""; s.ok = false; s.decoded = null; paint(s, "blank", ""); }
    },
  };
}

/**
 * Live-validated owner's key entry for a v2 kit: checksum, set and
 * commitment checked on every keystroke, like keyEntryPanel does for the
 * holders' keys. For a v1 kit it degenerates to an empty panel that is
 * always satisfied, so callers can wire it unconditionally.
 */
function ownerEntryPanel(vault, onChange) {
  if (!vault.needsOwnerKey) {
    return { fields: [], ok: () => true, decoded: () => null, clear: () => {} };
  }
  const id = uid("owner");
  const input = el("textarea", {
    id,
    class: "fieldin", rows: "3", placeholder: "Type the owner's key here",
    autocomplete: "off", spellcheck: "false", autocapitalize: "none",
  });
  const noteBox = note("blank", "");
  let decoded = null;
  let okFlag = false;
  let generation = 0;

  function paint(kind, content) {
    noteBox.className = `note note-${kind}`;
    noteBox.replaceChildren(
      ...(kind === "blank" ? [] : [icon(NOTE_ICON[kind])]),
      el("span", {}, [].concat(content))
    );
    input.classList.toggle("is-ok", kind === "ok");
    input.classList.toggle("is-bad", kind === "bad");
  }

  async function validate() {
    const gen = ++generation;
    const typed = normalizeCardInput(input.value);
    decoded = null;
    okFlag = false;
    if (typed.length < OWNER_KEY_LENGTH) {
      paint("blank", "");
      onChange();
      return;
    }
    let dec = null;
    try {
      dec = decodeOwnerKey(typed);
      await checkOwnerKey(vault, dec);
      if (gen !== generation) return; // superseded by newer input
      decoded = dec;
      okFlag = true;
      paint("ok", "Owner's key verified");
    } catch (err) {
      if (gen !== generation) return;
      // a wrong set gets the full diagnosis, same as the verify screens
      paint("bad", err.code === "OWNER_SET_MISMATCH" && dec
        ? wrongSetMessage(toHex(dec.setId).toUpperCase(), vault.setIdHex)
        : err.message);
    }
    onChange();
  }
  input.addEventListener("input", validate);

  return {
    // the owner's key leads the entry screens; the trailing divider is
    // part of the panel so a v1 kit (empty panel) leaves no stray rule
    fields: [el("div", { class: "field" }, [
      el("label", { class: "flabel", for: id, text: "OWNER'S KEY" }),
      input,
      noteBox,
    ]), el("div", { class: "hair spaced" })],
    ok: () => okFlag,
    decoded: () => decoded,
    clear: () => { input.value = ""; decoded = null; okFlag = false; paint("blank", ""); },
  };
}

const HOME_LINES = [
  "SPLIT A SECRET AMONG PEOPLE YOU TRUST",
  "RECOVER YOUR SECRET IN NEED",
  "SECURE YOUR DIGITAL LIFE",
  "KEEP YOUR SECRETS SAFE AND RECOVERABLE",
];

/**
 * Keystroke rhythm, no typos: hand alternation is fast, same-hand and
 * same-finger sequences drag, word starts cost extra, bursts break up.
 */
function planTyping(text) {
  const LEFT = "QWERTASDFGZXCVB";
  const hand = (c) => (c === " " ? " " : LEFT.indexOf(c) >= 0 ? "L" : "R");
  const g = () => (Math.random() + Math.random() + Math.random()) / 3;
  const q = [{ wait: 260 }];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const prev = text[i - 1] || "";
    let d = 44 + g() * 44;
    const a = hand(prev);
    const b = hand(ch);
    if (a !== " " && b !== " ") d *= a === b ? 1.25 : 0.8;
    if (prev === ch) d *= 1.35;
    if (prev === " ") d += 30;
    if (ch === " ") d *= 0.8;
    if (Math.random() < 0.05) d += 120 + g() * 170;
    q.push({ put: ch, wait: d });
  }
  // hold the finished line, then wipe it with a held backspace
  q.push({ idle: true, wait: 3200 });
  for (let i = text.length; i > 0; i--) {
    q.push({ del: true, wait: i === text.length ? 260 : 26 + Math.random() * 12 });
  }
  q.push({ wait: 420 });
  return q;
}

function typeInto(textNode, cursor) {
  let line = Math.floor(Math.random() * HOME_LINES.length);
  let queue = planTyping(HOME_LINES[line]);
  let i = 0;
  function step() {
    const s = queue[i++];
    if (!s) {
      let next = line;
      while (next === line) next = Math.floor(Math.random() * HOME_LINES.length);
      line = next;
      queue = planTyping(HOME_LINES[line]);
      i = 0;
      viewTimeout(step, 40);
      return;
    }
    if (s.del) textNode.textContent = textNode.textContent.slice(0, -1);
    else if (s.put) textNode.textContent += s.put;
    cursor.style.animation = s.idle ? "" : "none";
    viewTimeout(step, s.wait);
  }
  step();
}

/** SHA-256 of this file as it stands: the snapshot with its own vault. */
async function fileHash() {
  const b64 = readEmbeddedVaultB64();
  const source = b64 === null ? SOURCE_SNAPSHOT : withVault(SOURCE_SNAPSHOT, b64);
  return toHex(await sha256(new TextEncoder().encode(source)));
}

async function copyToClipboard(text, button, idleLabel, doneLabel) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    button.textContent = "COPY FAILED";
    return;
  }
  button.textContent = doneLabel;
  viewTimeout(() => { button.textContent = idleLabel; }, 1600);
}
