<style>
/* ================================================================== */
/* PHOSPHOR — KEEP design system v1                                    */
/*                                                                     */
/* One amber, one warning orange, a ladder of dimmed ambers for text.   */
/* Mono is the machine talking, sans is a person reading. Printed pages */
/* invert completely: white sheet, black ink, no glow.                  */
/* ================================================================== */

:root {
  color-scheme: dark;

  --screen: #080705;
  --well: #060502;
  --rule: #2b2210;
  --amber: #ffb000;
  --amber-lt: #ffd97a;
  --filament: #ffe9b3;
  --ink: #f2e3c2;
  --copy: #b39d6e;
  --dim: #8f7c50;
  --label: #6b5a33;
  --off: #4a4130;
  --warn: #ff8a3c;
  --reverse: #10130a;
  --btn-ink: #c08c22;

  --a03: rgba(255, 176, 0, 0.03);
  --a05: rgba(255, 176, 0, 0.05);
  --a07: rgba(255, 176, 0, 0.07);
  --a09: rgba(255, 176, 0, 0.09);
  --a12: rgba(255, 176, 0, 0.12);
  --a16: rgba(255, 176, 0, 0.16);
  --a28: rgba(255, 176, 0, 0.28);
  --a30: rgba(255, 176, 0, 0.3);
  --a42: rgba(255, 176, 0, 0.42);
  --a60: rgba(255, 176, 0, 0.6);
  --w45: rgba(255, 138, 60, 0.45);
  --w55: rgba(255, 138, 60, 0.55);
  --w07: rgba(255, 138, 60, 0.07);

  --glow-head: 0 0 0.0625rem rgba(255, 238, 200, 0.8), 0 0 0.75rem rgba(255, 176, 0, 0.5),
    0 0 2.375rem rgba(255, 176, 0, 0.22);
  --glow-hover: 0 0 0.375rem rgba(255, 220, 140, 0.85), 0 0 1rem rgba(255, 176, 0, 0.6),
    0 0 2.125rem rgba(255, 176, 0, 0.35);
  --glow-value: 0 0 0.625rem rgba(255, 176, 0, 0.35);
  --glow-key: 0 0 0.5rem rgba(255, 176, 0, 0.4);
  --glow-copy: 0 0 0.5rem rgba(179, 157, 110, 0.3);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

/* Global 150% scale: every screen length below is rem, so this one root
   size multiplies the whole UI — the same geometry a browser shows at
   150% zoom. Percentage, not px, so a user's own font-size preference
   still multiplies through. The printed sheets (section 08) stay in
   physical px/mm and are exempt on purpose: browser zoom never changes
   what comes out of the printer. */
html { font-size: 150%; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--screen);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* on body, not html: a font shorthand on html would reset the root
   font-size (rem there resolves against the browser default) */
body { font: 1rem/1.6 var(--sans); }

::selection { background: var(--amber); color: var(--reverse); }

/* Overlay scrollbars (src/scrollbar.js, ported from ravn-frontend): the
   native bar is hidden and an SVG line takes its place — a filament thumb
   that widens and brightens on hover and drag, identically in every
   engine, because none of it is a native scrollbar. */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
textarea.fieldin.grow,
.well.secret.prose { scrollbar-width: none; }
textarea.fieldin.grow::-webkit-scrollbar,
.well.secret.prose::-webkit-scrollbar { display: none; }

/* the wrapper an in-flow scrollable shares with its overlay */
.scrollhost { position: relative; flex: 1; min-width: 0; }

.kscroll {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 18px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 60ms ease-out;
  z-index: 6;
}
/* level with the shell, under the scan (3) and vignette (4) layers: the
   page's gauge is drawn on the phosphor like everything else */
.kscroll-page { position: fixed; top: 0; right: 0; bottom: auto; height: 100vh; z-index: 2; }
.kscroll[data-on] { opacity: 1; }
.kscroll svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* butt caps: square ends, matching the hard edges everywhere else */
.kscroll path { fill: none; stroke-linecap: butt; }
.kscroll .hit {
  stroke: transparent;
  stroke-width: 18px;
  pointer-events: stroke;
  cursor: grab;
}
.kscroll .thumb {
  /* the amber of the rule and the active tab — one colour in every state;
     only the width answers the hand */
  stroke: var(--amber);
  stroke-width: 3px;
  transition: stroke-width 140ms ease;
}
.kscroll .hit:hover + .thumb,
.kscroll[data-drag] .thumb { stroke-width: 8px; }
.kscroll[data-drag] .hit { cursor: grabbing; }
@media print { .kscroll { display: none; } }

/* ================================================================== */
/* 01 · shell — four fixed layers, then rail + column                  */
/* ================================================================== */

.fx { position: fixed; inset: 0; pointer-events: none; }
.fx-glow {
  z-index: 1;
  background: radial-gradient(68.75rem 37.5rem at 50% -15%, #1a1408 0%, rgba(12, 10, 6, 0) 70%);
  animation: kbreathe 9s ease-in-out infinite;
}
/* two-part CRT scan: a 0.25rem line grid that drifts, plus one bright bar rolling
   down the screen the way an untriggered vertical hold does.
   The pen's steps(60) jitter jumped the grid ~0.1625rem per step — a stepped
   raster sliding over static text is what read as the page bobbing. Here the
   grid instead crawls smoothly by exactly one 0.25rem tile per cycle: seamless at
   the loop point, so only the lines move and the content stays nailed down. */
.fx-scan { z-index: 3; overflow: hidden; }
.fx-scan::before,
.fx-scan::after {
  content: "";
  display: block;
  position: absolute;
  pointer-events: none;
}
.fx-scan::before {
  left: 0;
  width: 100%;
  height: 0.125rem;
  background: rgba(0, 0, 0, 0.3);
  opacity: 0.75;
  animation: kscanbar 6s linear infinite;
}
.fx-scan::after {
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
  background-size: 100% 0.25rem;
  animation: kscanlines 2s linear infinite;
}
@keyframes kscanbar { 0% { transform: translate3d(0, 200000%, 0); } }
@keyframes kscanlines {
  from { background-position: 0 0; }
  to { background-position: 0 0.25rem; }
}
.fx-vig {
  z-index: 4;
  background: radial-gradient(135% 135% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.42) 100%);
}
@keyframes kbreathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

.shell {
  position: relative;
  z-index: 2;
  display: flex;
  min-height: 100vh;
}

.rail {
  position: relative;
  flex: none;
  /* wide enough for the longest step label at the readable size, so nothing
     in the list has to wrap or clip */
  width: 12.25rem;
  border-right: 0.0625rem solid var(--rule);
  padding: 1.75rem 0.875rem;
}
.rail .railin {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: sticky;
  top: 1.75rem;
  min-height: calc(100vh - 3.5rem);
}

.main {
  flex: 1;
  min-width: 0;
  max-width: 51.25rem;
  margin: 0 auto;
  padding: 3.5rem 2.625rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  justify-content: safe center;
}
.main.top { justify-content: flex-start; }

@media (max-width: 1290px) { .main { padding: 2.75rem 1.75rem; } }
@media (max-width: 900px) {
  .rail { width: 9.375rem; padding: 1.375rem 0.625rem; }
  .main { padding: 2rem 1.125rem; }
}
@media (max-width: 645px) {
  /* 7.375rem fitted the old 0.5625rem labels; at a legible size the longest step
     needs this much, and clipping the step you are on is not an option */
  .rail { width: 8.375rem; padding: 1.25rem 0.5rem; }
  .main { padding: 1.625rem 0.875rem; }
}

/* ================================================================== */
/* 04 · rail — wordmark, step list / nav, key mark                     */
/* ================================================================== */

.kword {
  user-select: none;
  border: 0;
  background: none;
  padding: 0;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 5rem;
  height: 1.875rem;
  flex: none;
  font-family: var(--mono);
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--amber-lt);
  text-decoration: none;
  text-shadow: 0 0 0.75rem rgba(255, 176, 0, 0.5);
}
.kword span {
  pointer-events: none;
  letter-spacing: 0.375rem;
  margin-right: -0.375rem;
  transition: letter-spacing 180ms cubic-bezier(0.34, 1.56, 0.64, 1),
    margin-right 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
.kword:hover span { letter-spacing: 0.125rem; margin-right: -0.125rem; }
/* set for the first moments of a freshly rendered rail: a wordmark that
   mounts under the pointer starts compact instead of animating there */
.kword.nofx span { transition: none; }
.kword { cursor: default; }
button.kword { cursor: pointer; }
.kword:focus-visible { outline: 0.125rem solid var(--amber); outline-offset: 0.25rem; }

/* 0.625rem was below the size any checker will accept, and the pending steps sat
   at 3:1 against the screen. Sizes and the two dimmed ambers below are set so
   every state clears 4.5:1 at a readable size, with the ladder — done, then
   pending — still reading as a ladder. */
.steplist {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  gap: 0.8125rem;
  margin-top: 2.75rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.0875rem;
  white-space: nowrap;
}
.steplist .now {
  color: var(--reverse);
  font-weight: 700;
  background: var(--amber);
  box-shadow: 0 0 1.125rem rgba(255, 176, 0, 0.45);
  padding: 0.375rem 0.875rem;
  margin: 0 0.25rem;
  align-self: stretch;
}
.steplist .done { color: var(--copy); padding: 0 0.5rem; }
.steplist .todo { color: var(--dim); padding: 0 0.5rem; }
.steplist .navitem,
.steplist .now { display: flex; align-items: center; gap: 0.5rem; }
.steplist .icon svg { width: 0.8125rem; height: 0.8125rem; }
.steplist .navitem {
  color: var(--copy);
  padding: 0 0.875rem;
  text-decoration: none;
  cursor: pointer;
  background: none;
  border: 0;
  font: inherit;
  text-align: left;
  transition: color 0.14s linear, transform 0.16s cubic-bezier(0.33, 1, 0.68, 1),
    text-shadow 0.14s linear;
}
.steplist .navitem:hover,
.steplist .navitem:focus-visible {
  color: var(--amber-lt);
  transform: translateX(0.25rem);
  text-shadow: 0 0 0.625rem rgba(255, 176, 0, 0.45);
}
/* narrow rails give up letter-spacing, never legibility: the size holds at
   0.6875rem and the tracking absorbs the loss */
@media (max-width: 900px) { .steplist { font-size: 0.6875rem; letter-spacing: 0.05625rem; } }
@media (max-width: 645px) {
  .steplist { font-size: 0.6875rem; letter-spacing: 0.01875rem; }
  .steplist .now { padding: 0.375rem 0.4375rem; margin: 0 0.125rem; }
  .steplist .done, .steplist .todo, .steplist .navitem { padding: 0 0.4375rem; }
}

/* the key mark: teeth are cut from the live parameters, long tooth =
   a key that counts toward the threshold, short = spare */
.markwrap { margin-top: auto; padding-top: 2.125rem; flex: none; line-height: 0; }
/* the mark's width/height attributes are set in px by markMarkup(); this
   rem height (with width from the viewBox ratio) puts it on the same
   150% scale as everything else. .sheetmark overrides it back for paper. */
.kmark {
  height: 2.625rem;
  width: auto;
  overflow: visible;
  padding: 0.375rem 0.625rem;
  margin: -0.375rem -0.625rem;
  box-sizing: content-box;
  filter: drop-shadow(0 0 0.4375rem rgba(255, 176, 0, 0.45));
}
.kmark.is-out { padding: 1.25rem 4.375rem; margin: -1.25rem -4.375rem; }
.kmark .kp { transform-box: fill-box; transform-origin: center; transform: translateX(0); }
.kmark.is-out .kp { animation: kexplode 420ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--ed) both; }
.kmark.is-in .kp { animation: kimplode 340ms cubic-bezier(0.33, 1, 0.68, 1) var(--rd) both; }
.kmark .kb {
  transform-box: fill-box;
  transform-origin: center;
  transform: translateX(var(--mx, 0));
  transition: transform 170ms cubic-bezier(0.33, 1, 0.68, 1);
}
@keyframes kexplode {
  0% { transform: translateX(0); }
  16% { transform: translateX(calc(var(--dx) * -0.14)); }
  100% { transform: translateX(var(--dx)); }
}
@keyframes kimplode {
  0% { transform: translateX(var(--dx)); }
  72% { transform: translateX(calc(var(--dx) * -0.07)); }
  100% { transform: translateX(0); }
}

/* ================================================================== */
/* 03 · type                                                           */
/* ================================================================== */

.view { animation: view-in 220ms cubic-bezier(0.2, 0.7, 0.3, 1); }
@keyframes view-in { from { opacity: 0; } to { opacity: 1; } }

h1 {
  margin: 0 0 0.875rem;
  font-family: var(--mono);
  font-size: 1.9375rem;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.03125rem;
  color: var(--filament);
  text-shadow: var(--glow-head);
  text-wrap: pretty;
}
@media (max-width: 900px) { h1 { font-size: 1.5rem; } }
.cur { color: var(--amber); animation: kblink 1.06s step-end infinite; }
/* the blink hides the glyph rather than fading it to nothing: text left at
   opacity 0 is still text a contrast checker will measure against the
   background it is invisible on, and it reads as a false failure */
@keyframes kblink { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }

p { margin: 0 0 0.625rem; }
.lead {
  font-size: 0.90625rem;
  line-height: 1.65;
  color: var(--copy);
  max-width: 64ch;
  text-wrap: pretty;
  text-shadow: var(--glow-copy);
}
.fine { font-size: 0.78125rem; line-height: 1.6; color: var(--dim); max-width: 64ch; }
/* footer lines that should run the full column instead of the 64ch measure */
.fine.wide { max-width: none; }
.keymeta {
  font-family: var(--mono);
  font-size: 0.78125rem;
  letter-spacing: 0.0625rem;
  font-weight: 700;
  color: var(--amber-lt);
}
.rule { height: 0.125rem; flex: none; background: var(--amber); margin: 0.5rem 0 1.125rem; }
.hair { height: 0.0625rem; flex: none; background: var(--rule); }
a { color: var(--amber-lt); }

/* the mono micro-labels: 0.625rem was under every checker's floor, and --label
   scored 3:1 — both now sit where small caption text is still readable */
.kicker {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1125rem;
  color: var(--dim);
  margin-bottom: 0.5625rem;
}
/* when a kicker opens a new section straight after a list of rows */
.kicker.spaced { margin-top: 2.125rem; }
.strip {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1.125rem 0 0.875rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.125rem;
  color: var(--dim);
  white-space: nowrap;
}
.strip .line { flex: 1; height: 0.0625rem; background: var(--rule); min-width: 0; }

/* ================================================================== */
/* 05 · controls                                                       */
/* ================================================================== */

.btnrow {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 2rem;
  flex-wrap: wrap;
}
/* Back / Cancel stay left, the one amber action is pinned to the right */
.btnrow .btn-go, .btnrow .right { margin-left: auto; }
/* a button row acting on the well above it (COPY / SAVE FILE HASH) belongs
   to that well: the 2rem breathing room moves to the far side instead */
.well + .btnrow { margin-top: 0; }
.well + .btnrow + .note { margin-top: 2rem; }
.btnrow .btn-go ~ .btn-go { margin-left: 0; }
/* rows whose amber action leads instead of closing the screen */
.btnrow.start .btn-go { margin-left: 0; }

.btn {
  font: 700 0.78125rem var(--mono);
  letter-spacing: 0.15625rem;
  white-space: nowrap;
  max-width: 100%;
  padding: 0.9375rem 1.625rem;
  border: 0.0625rem solid var(--rule);
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0;
  transition: border-color 0.15s linear, background 0.15s linear, color 0.15s linear,
    text-shadow 0.15s linear, box-shadow 0.15s linear;
}
.btn .icon { margin-right: 0.625rem; }
.btn .icon svg { width: 0.9375rem; height: 0.9375rem; display: block; }
.btn:focus-visible { outline: 0.125rem solid var(--amber); outline-offset: 0.125rem; }

.btn-ghost:hover { background: var(--a07); color: var(--amber-lt); }

.btn-go {
  border: 0.0625rem solid var(--a42);
  background: var(--a05);
  color: var(--btn-ink);
  padding: 0.9375rem 1.75rem;
}
.btn-go:hover {
  border-color: var(--amber);
  background: var(--a12);
  color: var(--amber);
  text-shadow: var(--glow-hover);
  box-shadow: 0 0 0.375rem rgba(255, 176, 0, 0.3), 0 0 2.125rem rgba(255, 176, 0, 0.18);
}
.btn-go:hover .gocur { animation: kblink 1.06s step-end infinite; }
.gocur { color: inherit; }

/* WCAG exempts inactive controls from contrast, but these say things worth
   reading while they are disabled ("RUNNING…", a button waiting on input),
   so the muted border carries the disabled state and the text stays legible */
.btn[disabled] {
  border-color: var(--rule);
  background: transparent;
  color: var(--dim);
  cursor: not-allowed;
  text-shadow: none;
  box-shadow: none;
}
.btn[disabled]:hover { border-color: var(--rule); background: transparent; color: var(--dim); }
.btn[disabled] .gocur { animation: none; }

.btn-small { font-size: 0.75rem; padding: 0.75rem 1.25rem; }
/* narrow screens: buttons wrap rather than push the column sideways */
@media (max-width: 900px) {
  .btn { white-space: normal; letter-spacing: 0.1rem; font-size: 0.75rem; padding: 0.8125rem 1rem; }
  .btnrow { gap: 0.625rem; margin-top: 1.625rem; }
  .kword { font-size: 1.25rem; width: 4.125rem; }
}

/* stepper */
.stepper {
  display: inline-flex;
  width: fit-content;
  align-items: stretch;
  border: 0.0625rem solid var(--a42);
  box-shadow: 0 0 0.875rem rgba(255, 176, 0, 0.06), inset 0 0 0.875rem rgba(255, 176, 0, 0.04);
}
.stepper button {
  border: 0;
  background: none;
  cursor: pointer;
  font: 700 0.9375rem var(--mono);
  color: var(--amber);
  padding: 0.625rem 1rem;
  transition: background 0.14s, color 0.14s, box-shadow 0.14s;
}
.stepper button:hover:not([disabled]) { background: var(--a16); box-shadow: inset 0 0 1.375rem var(--a12); }
.stepper button[disabled] { color: var(--off); cursor: not-allowed; }
.stepper button:first-child { border-right: 0.0625rem solid var(--a28); }
.stepper button:last-child { border-left: 0.0625rem solid var(--a28); }
.stepper .val {
  min-width: 3.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 1.1875rem var(--mono);
  color: var(--filament);
  text-shadow: var(--glow-value);
}

/* fields */
/* a field label has to be readable to be a label: 0.75rem and the dimmed amber
   that clears 4.5:1, rather than the 0.625rem --label that scored 3:1 */
.flabel {
  display: block;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1rem;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
}
.fhint { font-size: 0.78125rem; color: var(--dim); line-height: 1.5; margin: -0.375rem 0 0.75rem; }
.frow { display: flex; align-items: stretch; gap: 0.625rem; }
.frow .btn { flex: none; width: 5.75rem; padding: 0; justify-content: center; }
/* beside the multi-line box the toggle keeps button height instead of
   stretching into a column as tall as the text area */
.frow:has(textarea) { align-items: flex-start; }
.frow:has(textarea) .btn { padding: 0.9375rem 0; }

.fieldin {
  font: 400 1rem var(--mono);
  width: 100%;
  min-width: 0;
  display: block;
  box-sizing: border-box;
  background: var(--a03);
  border: 0.0625rem solid var(--a28);
  color: var(--filament);
  letter-spacing: 0.0625rem;
  padding: 0.875rem 1rem;
  outline: none;
  transition: border-color 0.15s linear, box-shadow 0.15s linear;
}
.fieldin:focus { border-color: var(--a60); box-shadow: 0 0 1.125rem rgba(255, 176, 0, 0.1); }
/* placeholders are text too, and the only hint some fields carry */
.fieldin::placeholder { color: var(--dim); }
textarea.fieldin {
  resize: none;
  color: var(--amber-lt);
  letter-spacing: 0.09375rem;
  word-spacing: 0.5rem;
  line-height: 1.9;
  overflow-wrap: anywhere;
}
/* key entry is fixed-size on purpose (keys have one shape); the multi-line
   secret does not, so its boxes scale vertically to the text being written */
textarea.fieldin.grow { resize: vertical; min-height: 8rem; }
.fieldin.is-ok { border-color: var(--a60); }
.fieldin.is-bad { border-color: var(--w55); }

.field { margin-bottom: 1.375rem; }
/* the status note answers the pair directly above it: the last field keeps
   only the note's own 0.875rem gap — the spacing the verify-key screen
   uses between its input and its notice */
.secretfields .field:last-child { margin-bottom: 0; }

/* notices — they reserve their 3.25rem whether or not there is anything
   to say, so layout never jumps under the user's hands */
.note {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: 3.25rem;
  box-sizing: border-box;
  padding: 0.875rem 1rem;
  margin: 0.875rem 0;
  border: 0.0625rem solid transparent;
  font-size: 0.875rem;
  line-height: 1.55;
}
.note .icon { flex: none; display: inline-flex; }
.note .icon svg { width: 1rem; height: 1rem; display: block; }
.note .tail { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.075rem; }
.note-ok, .note-info { border-color: var(--a30); background: var(--a05); color: var(--amber); }
.note-bad { border-color: var(--w45); background: var(--w07); color: var(--warn); }
.note-blank { border-color: transparent; background: transparent; }
.note strong { color: inherit; }
.note code { font-family: var(--mono); font-size: 0.8125rem; color: var(--amber-lt); }

/* ================================================================== */
/* 06 · blocks                                                         */
/* ================================================================== */

.stats { display: flex; gap: 0.625rem; flex-wrap: wrap; margin: 0 0 1.5rem; }
.stat { flex: 1; min-width: 9.375rem; border: 0.0625rem solid var(--rule); padding: 0.875rem 1rem; }
.stat .l {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1rem;
  color: var(--dim);
  margin-bottom: 0.5rem;
}
.stat .v {
  font-family: var(--mono);
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--filament);
  text-shadow: var(--glow-value);
  overflow-wrap: anywhere;
}

/* action rows — 2.625rem icon plate, 0.0625rem rules between, no card */
.row {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 1.125rem;
  padding: 1.375rem 1.125rem;
  text-align: left;
  text-decoration: none;
  color: inherit;
  background: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
}
.row:hover {
  background: var(--a09);
  box-shadow: inset 0 0 2.125rem var(--a07), 0 0 1.375rem var(--a12);
}
.row:hover .t { color: var(--filament); text-shadow: var(--glow-hover); }
.row:hover .plate { box-shadow: 0 0 1.125rem var(--a16), inset 0 0 0.875rem var(--a07); }
.row:hover .rowcur { visibility: visible; animation: kblink 1.06s step-end infinite; }
.row:focus-visible { outline: 0.125rem solid var(--amber); outline-offset: -0.125rem; }
.plate {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.625rem;
  height: 2.625rem;
  border: 0.0625rem solid var(--a42);
  box-shadow: 0 0 0.875rem var(--a07), inset 0 0 0.875rem var(--a05);
  color: var(--amber);
}
.plate svg { width: 1.1875rem; height: 1.1875rem; display: block; }
.row .body { flex: 1; min-width: 0; }
.row .t {
  display: block;
  font-size: 1.0625rem;
  font-weight: 650;
  margin-bottom: 0.25rem;
  color: var(--amber-lt);
  text-shadow: 0 0 0.625rem rgba(255, 176, 0, 0.3);
}
.row .d { display: block; font-size: 0.8125rem; color: var(--dim); line-height: 1.5; }
/* hidden, not transparent — same reserved space, but no invisible text for a
   contrast checker to measure (see kblink) */
.rowcur { color: var(--amber); visibility: hidden; }
.row.tall { padding: 1.875rem 1.125rem; }
.row.tall .t { font-size: 1.125rem; }

/* static information rows (precautions) */
.prep { display: flex; align-items: center; gap: 1.25rem; padding: 1.375rem 1.125rem; transition: background 0.15s, box-shadow 0.15s; }
.prep:hover {
  background: var(--a05);
  box-shadow: inset 0 0 2.5rem rgba(255, 176, 0, 0.04), 0 0 1.375rem var(--a12);
}
.prep:hover .t { color: var(--filament); text-shadow: var(--glow-hover); }
.prep:hover .plate { box-shadow: 0 0 1.125rem var(--a16), inset 0 0 0.875rem var(--a07); }
.prep .plate { width: 2.5rem; height: 2.5rem; }
.prep .plate svg { width: 1.125rem; height: 1.125rem; }
.prep .body { flex: 1; min-width: 0; }
.prep .t {
  display: block;
  font-size: 1.03125rem;
  font-weight: 650;
  margin-bottom: 0.375rem;
  color: var(--amber-lt);
  text-shadow: 0 0 0.625rem rgba(255, 176, 0, 0.3);
}
.prep .d { display: block; font-size: 0.84375rem; color: var(--dim); line-height: 1.6; max-width: 62ch; }

/* the well — hashes, keys, anything read aloud or typed back */
.well {
  border: 0.0625rem solid var(--a42);
  background: var(--well);
  box-shadow: inset 0 0 2.5rem var(--a07);
  padding: 1.25rem 1.375rem;
  margin: 0 0 0.875rem;
  font-family: var(--mono);
  font-size: 1.0625rem;
  line-height: 2;
  letter-spacing: 0.125rem;
  word-spacing: 0.75rem;
  color: var(--amber-lt);
  text-shadow: var(--glow-key);
  overflow-wrap: anywhere;
  user-select: all;
}
.well.key { font-size: 1.1875rem; line-height: 2.1; letter-spacing: 0.125rem; word-spacing: 0.8125rem; padding: 1.5rem 1.625rem; }
.well.secret { font-size: 1.375rem; letter-spacing: 0.1875rem; word-spacing: normal; line-height: 1.7; padding: 1.625rem; }
/* a multi-line secret is read, not transcribed character by character:
   body size, real line breaks kept, and room to scroll if it runs long */
.well.secret.prose {
  font-size: 1rem;
  letter-spacing: 0.0625rem;
  line-height: 1.75;
  white-space: pre-wrap;
  max-height: 24rem;
  overflow-y: auto;
}
@media (max-width: 900px) {
  .well { font-size: 0.875rem; padding: 1rem 0.875rem; word-spacing: 0.5rem; }
  .well.key { font-size: 0.9375rem; padding: 1.125rem 1rem; word-spacing: 0.5rem; }
  .well.secret { font-size: 1.0625rem; padding: 1.125rem 1rem; }
}

/* progress — 2.375rem bar, difference-blended label */
.progress {
  position: relative;
  height: 2.375rem;
  border: 0.0625rem solid rgba(255, 176, 0, 0.35);
  padding: 0.0625rem;
  overflow: hidden;
}
.progress .fill {
  height: 100%;
  width: 0;
  background: var(--amber);
  box-shadow: 0 0 0.875rem rgba(255, 176, 0, 0.5);
  transition: width 220ms linear;
}
.progress .cap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1875rem;
  /* difference-blend cutout: the label must be the exact fill amber, so over
     the fill it cancels to black (cut out) and over the dark track it reads
     amber. A lighter amber leaves green/blue channel residue — blue text. */
  color: var(--amber);
  mix-blend-mode: difference;
}
.busybox { display: flex; flex-direction: column; justify-content: center; min-height: 21.25rem; }

/* self-test rows */
.strow { display: flex; align-items: center; gap: 1.125rem; padding: 1rem 1.125rem; }
.strow .n { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.0625rem; flex: none; width: 1.625rem; color: var(--dim); }
.strow .s { font-family: var(--mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.0625rem; flex: none; width: 4.625rem; }
.strow .s.pass { color: #7ed37f; }
.strow .s.run { color: var(--amber); }
/* the idle placeholder is still status text someone has to read, so it sits
   at the readable dim rather than the near-invisible --off */
.strow .s.wait { color: var(--dim); }
.strow .s.fail { color: var(--warn); }
.strow .body { flex: 1; min-width: 0; }
.strow .t { font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.1875rem; color: var(--amber-lt); text-shadow: 0 0 0.625rem rgba(255, 176, 0, 0.28); }
.strow .d { font-size: 0.78125rem; color: var(--dim); line-height: 1.5; }
.strow .ms {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.0625rem;
  flex: none;
  width: 4.25rem;
  text-align: right;
  white-space: nowrap;
  color: var(--dim);
}
@media (max-width: 900px) {
  .strow { gap: 0.625rem; padding: 0.875rem 0.25rem; }
  .strow .d, .strow .ms { display: none; }
}

/* modal */
.modal {
  position: fixed;
  inset: 0;
  /* under the scan and vignette layers (3 and 4) so the sheet sits inside
     the screen effect rather than floating on top of it; above .shell (2)
     by DOM order, since the layer is appended to <body> after it */
  z-index: 2;
  background: rgba(4, 3, 2, 0.94);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.modal .msheet {
  width: 100%;
  max-width: 35rem;
  background: #0c0a06;
  border: 0.0625rem solid var(--a42);
  box-shadow: 0 0 3.75rem rgba(0, 0, 0, 0.7), 0 0 2.125rem var(--a12);
  padding: 1.875rem;
}
/* the sheet is already the warning: the message is plain copy, no box, in the
   same amber as every lead paragraph on the screens behind it */
.modal .mtext {
  margin: 0 0 1.625rem;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--copy);
  text-shadow: var(--glow-copy);
  max-width: 52ch;
  text-wrap: pretty;
}

/* ================================================================== */
/* 08 · paper — the printed documents                                  */
/* ================================================================== */

/* the tabs sit straight on the amber rule below them, so they carry no
   underline of their own and leave no gap before it */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  margin: 1.25rem 0 0;
}
.tabs + .rule { margin-top: 0; }
.tab {
  font: 700 0.6875rem var(--mono);
  letter-spacing: 0.125rem;
  color: var(--dim);
  background: none;
  border: 0;
  padding: 0.75rem 1rem;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.14s linear, background 0.14s linear, box-shadow 0.14s linear;
}
.tab:hover { color: var(--amber-lt); background: var(--a07); }
.tab.on {
  color: var(--reverse);
  background: var(--amber);
  box-shadow: 0 0 1.125rem rgba(255, 176, 0, 0.45);
}
.tab:focus-visible { outline: 0.125rem solid var(--amber); outline-offset: -0.125rem; }
@media (max-width: 900px) { .tab { font-size: 0.59375rem; letter-spacing: 0.0625rem; padding: 0.625rem 0.5rem; } }

.paper {
  border: 0.0625rem solid var(--rule);
  background: #100d07;
  padding: 1.625rem;
  overflow: hidden;
}
.papfit { transform-origin: top left; }

/* One A4 sheet at 96dpi, with a 2cm margin as its own padding. The
   printed page keeps exactly this geometry (@page margin 0, so the
   browser has no margin box for its own header and footer; the sheet's
   own 20mm padding is the margin), so preview and paper agree line for
   line. */
.sheet {
  position: relative;
  box-sizing: border-box;
  width: 794px;
  height: 1123px;
  padding: 76px;
  overflow: hidden;
  background: #fff;
  color: #141414;
  text-shadow: none;
  font: 400 15.2px/1.55 var(--sans);
}
.sheet + .sheet { margin-top: 26px; }
/* wordmark left, print date right — the brand lives here, not in the titles */
.sheethead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 13.4px;
  margin-bottom: 30px;
}
.sheethead .sheetword {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 6px;
  margin-right: -6px;
  color: #141414;
}
/* the key mark, inked: the rails' amber is set as an SVG attribute, and a
   stylesheet rule beats a presentation attribute */
.sheetmark {
  position: absolute;
  left: 76px;
  bottom: 52px;
  line-height: 0;
}
/* ink does not glow: drop the rail mark's phosphor halo on paper */
.sheetmark .kmark { overflow: visible; height: 26px; width: auto; filter: none; }
.sheetmark rect.kb { fill: #141414; }
.sheetmark circle.kb { stroke: #141414; }
.sheetfoot {
  position: absolute;
  right: 76px;
  bottom: 56px;
  font-family: var(--mono);
  font-size: 13.4px;
}
.sheetbody { display: flow-root; }
.sheet h1 {
  font: 700 21.6px/1.25 var(--sans);
  color: #141414;
  text-shadow: none;
  letter-spacing: -0.01em;
  margin: 0 0 0.8em;
}
.sheet h2 {
  font: 700 15.7px/1.3 var(--sans);
  margin: 1.7em 0 0.5em;
  padding-bottom: 5px;
  border-bottom: 2px solid #141414;
}
.sheet p { margin: 1em 0; }
.sheet ul, .sheet ol { margin: 1em 0; padding-left: 26px; }
.sheet li { margin-bottom: 0.25em; }
.sheet table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
.sheet th, .sheet td {
  border: 1px solid #999;
  padding: 8px 10px;
  text-align: left;
  vertical-align: bottom;
  font-size: 15.2px;
  font-weight: 400;
}
.sheet th { background: #f3f3f3; font-size: 13.4px; font-weight: 600; }
/* label/value table: the labels get a fixed share so a long hash wraps
   in the value cell instead of squeezing the label */
.sheet table.kv th { width: 34%; }
.sheet .mono { font-family: var(--mono); overflow-wrap: anywhere; }
.sheet .ul { text-decoration: underline; }
.sheet .blank { display: block; height: 1.6em; border-bottom: 1px solid #555; }
.sheet .blank.inline {
  display: inline-block;
  width: 260px;
  height: 1.15em;
  vertical-align: baseline;
  margin-left: 6px;
}
.sheet .blank + .blank { margin-top: 0.9em; }
/* an aside under the line it explains, not a paragraph in its own right */
.sheet p.fineprint { margin: -0.55em 0 1em; font-size: 13.4px; color: #444; }
.sheet .keyline { display: block; height: 2.4em; border-bottom: 1px solid #555; }
.sheet .keyline + .keyline { margin-top: 1.1em; }
.sheet tr, .sheet li, .sheet p { break-inside: avoid; orphans: 3; widows: 3; }

@media print {
  html, body { background: #fff; }
  .fx, .rail, .noprint { display: none !important; }
  .shell { display: block; min-height: 0; }
  .main { max-width: none; margin: 0; padding: 0; display: block; }
  .paper { border: 0; background: none; padding: 0; overflow: visible; }
  .papfit { transform: none !important; width: auto !important; height: auto !important; }
  .sheet {
    width: auto;
    /* full A4, less 1mm of slack so rounding cannot push a blank sheet
       after every page; the 2cm margin is the sheet's own padding */
    height: 296mm;
    margin: 0;
    padding: 20mm;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }
  .sheetfoot { right: 20mm; bottom: 15mm; }
  /* margin: 0 leaves the browser no margin box to draw its own URL, title,
     date and page-count furniture in — the printed page is only ours */
  @page { size: A4; margin: 0; }
}

/* ================================================================== */
/* 07 · motion kill switch                                             */
/* ================================================================== */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* narrow screens: the icon plate lines up with the row title once the
   text wraps (declared last so it beats the base .row alignment) */
@media (max-width: 900px) {
  .row, .prep { align-items: flex-start; gap: 0.875rem; padding: 1.125rem 0.25rem; }
}

.icon { display: inline-flex; }
.icon svg { display: block; }

/* icon micro-animations — one run per hover of the surrounding row,
   prep item, or button. Sub-part transforms use px on SVG children,
   which the browser reads as viewBox units, so they scale with the
   icon; only the whole-svg pen/blink nudges use rem. The global
   prefers-reduced-motion block above disables all of these. Screen
   only: paper sheets and shackles stay put on paper. */
@media screen {
  :is(.row, .prep, .btn, .navitem):hover .icon-rotate svg {
    animation: ico-spin 1.2s ease-in-out 1;
  }
  :is(.row, .prep, .btn, .navitem):hover .icon-shield .i-draw {
    stroke-dasharray: 1;
    animation: ico-draw 0.55s ease-out 0.1s 1 both;
  }
  /* heartbeat: the trace wipes out left-to-right, then wipes back in
     the same way and stays — starting and ending at the resting state */
  :is(.row, .prep, .btn, .navitem):hover .icon-wave .i-draw {
    stroke-dasharray: 1;
    animation: ico-heart 0.8s linear both;
  }
  .icon-unlock .i-shackle {
    transform-box: fill-box;
    transform-origin: 8% 92%;
    transition: transform 0.3s ease-in;
  }
  :is(.row, .prep, .btn, .navitem):hover .icon-unlock .i-shackle {
    animation: ico-shackle 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1 both;
  }
  /* printer: no sheet at rest — hovering prints one out, held until
     the pointer leaves */
  :is(.row, .prep, .btn, .navitem):hover .icon-printer .i-paper {
    animation: ico-paper 0.6s ease-out both;
  }
  /* eye: the pupil glances left, then right, then settles back centre;
     the outline never moves */
  :is(.row, .prep, .btn, .navitem):hover .icon-eye .i-pupil {
    animation: ico-look 1.4s ease-in-out 1;
  }
  /* pen: nib advances and wags as if writing (pivot at the tip),
     holds until the pointer leaves */
  .icon-pen .i-pen {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    transition: transform 0.3s ease-in;
  }
  :is(.row, .prep, .btn, .navitem):hover .icon-pen .i-pen {
    animation: ico-write 0.7s ease-in-out both;
  }
  :is(.row, .prep, .btn, .navitem):hover .icon-download svg {
    animation: ico-dip 0.45s ease-out 1;
  }
  /* wifi: hovering cuts the connection — the off-slash draws itself
     corner to corner and holds until the pointer leaves */
  :is(.row, .prep, .btn, .navitem):hover .icon-wifi .i-slash {
    stroke-dasharray: 1;
    animation: ico-slash 0.4s ease-out both;
  }
  /* status checks draw themselves in the moment they appear */
  .icon-check .i-draw {
    stroke-dasharray: 1;
    animation: ico-draw 0.4s ease-out 1 both;
  }
  /* warnings rattle for attention the moment they appear — a dampened
     side-to-side shake, wherever the icon shows up */
  .icon-warning svg {
    animation: ico-alarm 0.6s ease-in-out 1;
  }
  /* the rail's selected entry wears its icon's finished pose: padlock
     open, sheet printed (the other icons already rest there) */
  .steplist .now .i-shackle { transform: rotate(-27deg); }
  .steplist .now .i-paper { opacity: 1; }
}
@keyframes ico-spin { to { transform: rotate(180deg); } }
@keyframes ico-alarm {
  0%, 100% { transform: rotate(0deg); }
  15% { transform: rotate(-9deg); }
  30% { transform: rotate(8deg); }
  45% { transform: rotate(-6deg); }
  60% { transform: rotate(4deg); }
  75% { transform: rotate(-2deg); }
}
@keyframes ico-draw {
  from { stroke-dashoffset: 1; }
  to { stroke-dashoffset: 0; }
}
/* offset 0 -> -1 wipes the line out tail-first to the right; the jump
   to 1 happens while the path is fully invisible, and 1 -> 0 draws it
   back in head-first the same direction. */
@keyframes ico-heart {
  0% { stroke-dashoffset: 0; }
  50% { stroke-dashoffset: -1; }
  50.01% { stroke-dashoffset: 1; }
  100% { stroke-dashoffset: 0; }
}
@keyframes ico-shackle {
  55% { transform: rotate(-33deg); }
  100% { transform: rotate(-27deg); }
}
@keyframes ico-paper {
  from { transform: translateY(-4.5px); opacity: 1; }
  to { transform: translateY(0); opacity: 1; }
}
/* eye movement is saccadic: the hop to each side is quick, the dwell
   there long, like a glance rather than a sweep */
@keyframes ico-look {
  0% { transform: translateX(0); }
  12%, 40% { transform: translateX(-2.5px); }
  52%, 80% { transform: translateX(2.5px); }
  92%, 100% { transform: translateX(0); }
}
@keyframes ico-write {
  0% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(1px, 0.3px) rotate(-4deg); }
  50% { transform: translate(2px, -0.2px) rotate(3deg); }
  75% { transform: translate(3px, 0.3px) rotate(-4deg); }
  100% { transform: translate(4px, 0) rotate(0deg); }
}
/* the printed sheet and the wifi off-slash exist only under a hovered
   icon (screen and print alike), so they hide outside the media block */
.i-paper, .i-slash { opacity: 0; }
@keyframes ico-slash {
  from { stroke-dashoffset: 1; opacity: 1; }
  to { stroke-dashoffset: 0; opacity: 1; }
}
@keyframes ico-dip {
  0%, 100% { transform: translateY(0); }

// GF(2^8) arithmetic over the AES field, reduction polynomial
// x^8 + x^4 + x^3 + x + 1 (0x11B). No lookup tables: the branchless
// Russian-peasant multiply below is the whole audit surface.

/** Multiply two field elements. */
function gfMul(a, b) {
  a &= 0xff;
  b &= 0xff;
  let p = 0;
  for (let i = 0; i < 8; i++) {
    p ^= -(b & 1) & a;
    const hi = -((a >> 7) & 1);
    a = (a << 1) & 0xff;
    a ^= hi & 0x1b;
    b >>= 1;
  }
  return p & 0xff;
}

/** a^e by square-and-multiply. */
function gfPow(a, e) {
  let r = 1;
  let base = a & 0xff;
  while (e > 0) {
    if (e & 1) r = gfMul(r, base);
    base = gfMul(base, base);
    e >>= 1;
  }
  return r;
}

/** Multiplicative inverse; a^254 = a^-1 in GF(256). Throws on 0. */
function gfInv(a) {
  if ((a & 0xff) === 0) throw new RangeError("gfInv(0) is undefined");
  return gfPow(a, 254);
}

/** Divide a by b. */

 * Evaluate a polynomial (coefficients low-degree first) at x via Horner.
 * coeffs[0] is the constant term (the secret byte).

  let y = 0;
  for (let i = coeffs.length - 1; i >= 0; i--) {
    y = gfMul(y, x) ^ coeffs[i];

  return y & 0xff;
}

 * Returns the constant term of the unique degree-(len-1) polynomial.
 * xs must be nonzero and pairwise distinct.

  const n = xs.length;

  for (let i = 0; i < n; i++) {
    let num = 1;
    let den = 1;
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      num = gfMul(num, xs[j]);
      den = gfMul(den, xs[j] ^ xs[i]);

// A text buffer that can be erased. The secret fields hold what was typed
// here rather than in a JS string: strings are immutable, so every edit
// leaves the previous value stranded in the heap until the collector gets
// to it, and nothing in the language can overwrite it in the meantime. A
// typed array can be zeroed the moment the value is no longer needed.
//
// Indices are code points throughout, which is also what the masked field
// renders one bullet per — so caret offsets coming back from the DOM line
// up with positions in here even when the text contains astral characters.



/** Code points of `text`, as numbers — no per-character strings. */
function codePoints(text) {
  const out = [];
  for (let i = 0; i < text.length; ) {
    const cp = text.codePointAt(i);
    out.push(cp);
    i += cp > 0xffff ? 2 : 1;
  }
  return out;
}

function wipeableText() {

  let len = 0;

  function grow(needed) {
    if (needed <= buf.length) return;
    let cap = buf.length;
    while (cap < needed) cap *= 2;
    const next = new Uint32Array(cap);
    next.set(buf.subarray(0, len));
    buf.fill(0); // the old storage held the secret; don't leave it behind
    buf = next;
  }

  return {
    get length() { return len; },

    /** Replace [start, end) with `text`; returns how many code points went in. */
    splice(start, end, text) {
      const from = Math.max(0, Math.min(start, len));
      const to = Math.max(from, Math.min(end, len));
      const ins = text ? codePoints(text) : [];
      const tail = len - to;
      grow(from + ins.length + tail);
      buf.copyWithin(from + ins.length, to, len);
      for (let i = 0; i < ins.length; i++) buf[from + i] = ins[i];
      const wasLen = len;
      len = from + ins.length + tail;
      if (len < wasLen) buf.fill(0, len, wasLen);
      return ins.length;
    },

    setFrom(text) {
      this.clear();
      this.splice(0, 0, text);
    },

    /** One character, for the brief peek at what was just typed. */
    charAt(i) { return String.fromCodePoint(buf[i]); },

    /** UTF-8 bytes, encoded straight from code points so the plaintext
     *  never passes through a string on its way to the cipher. */
    bytes() { return utf8FromCodePoints(buf, len); },
    byteLength() { return utf8LengthFromCodePoints(buf, len); },

    /** Compare without materialising either value. */
    equals(other) {
      if (len !== other.length) return false;
      let diff = 0;
      for (let i = 0; i < len; i++) diff |= buf[i] ^ other.codePointAt(i);
      return diff === 0;

    codePointAt(i) { return buf[i]; },

    /** Only for the SHOW toggle and IME composition, where the browser has

    clear() {
      buf.fill(0);
      len = 0;
    },

    /** Test seam: the backing store, to check that clearing really erases. */
    _storage() { return buf; },

/* ===== src/scrollbar.js ===== */
// Overlay scrollbar, ported from ravn-frontend's CurvedEdgeScrollbar
// (straight-edge variant, no React). The native scrollbar is hidden and an
// SVG line takes its place: the thumb is a dashed stroke, a transparent
// wider stroke over the same segment is the grab target, and hovering or
// dragging widens the thumb with a real CSS transition. Because none of it
// is a native scrollbar, the expand works identically in every engine —
// Firefox included.

const SB_GUTTER = 18;  // overlay width; also the grab stroke
const SB_REST = 3;     // thumb at rest
const SB_HOVER = 8;    // thumb under the hand (see .kscroll rules)
const SB_MIN_THUMB = 36;
const SB_INSET = 4;    // track stands off the box edges

 * Mount an overlay scrollbar for `scrollNode` inside `host` (a

 * Returns { update, destroy }; the caller owns the update cadence beyond
 * the listeners wired here.

  shell.className = page ? "kscroll kscroll-page" : "kscroll";
  shell.setAttribute("aria-hidden", "true");
  // built through innerHTML so the SVG namespace never appears as a URL in
  // the source (the build lint rejects anything scheme-shaped)

    '<svg preserveAspectRatio="none"><path class="hit"></path><path class="thumb"></path></svg>';
  const svg = shell.firstElementChild;
  const hit = svg.children[0];
  const thumb = svg.children[1];
  host.append(shell);

  let maxDash = 0;
  let maxScroll = 0;

  function measure() {
    return {
      sh: scrollNode.scrollHeight,
      ch: page
        ? (window.innerHeight || document.documentElement.clientHeight)
        : scrollNode.clientHeight,
      st: scrollNode.scrollTop,
    };
  }

  function update() {
    const { sh, ch, st } = measure();
    if (!ch || sh <= ch + 1) {
      delete shell.dataset.on;
      return;
    }
    shell.dataset.on = "true";
    const x = SB_GUTTER - SB_HOVER / 2 - 2;
    const y0 = SB_INSET + SB_HOVER / 2;
    const y1 = ch - SB_INSET - SB_HOVER / 2;
    const trackLen = Math.max(0, y1 - y0);
    const thumbLen = Math.min(trackLen, Math.max((ch / sh) * trackLen, SB_MIN_THUMB));
    maxDash = Math.max(0, trackLen - thumbLen);
    maxScroll = sh - ch;
    const off = maxScroll > 0 ? (st / maxScroll) * maxDash : 0;
    const d = `M ${x} ${y0} L ${x} ${y1}`;
    svg.setAttribute("viewBox", `0 0 ${SB_GUTTER} ${ch}`);
    for (const p of [hit, thumb]) {
      p.setAttribute("d", d);
      // one dash the length of the thumb, then a gap longer than the track:
      // the dash IS the thumb, and sliding the offset scrolls it
      p.setAttribute("stroke-dasharray", `${thumbLen} ${trackLen + thumbLen}`);
      p.setAttribute("stroke-dashoffset", String(-off));
    }

  let drag = null;
  hit.addEventListener("pointerdown", (e) => {
    if (maxDash <= 0) return;
    e.preventDefault();
    e.stopPropagation();
    hit.setPointerCapture(e.pointerId);
    drag = {
      id: e.pointerId,
      startY: e.clientY,
      startTop: scrollNode.scrollTop,
      maxDash,
      maxScroll,
    };
    shell.dataset.drag = "true";
  });
  hit.addEventListener("pointermove", (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    e.preventDefault();
    const delta = drag.maxDash > 0
      ? ((e.clientY - drag.startY) / drag.maxDash) * drag.maxScroll
      : 0;
    scrollNode.scrollTop = Math.min(drag.maxScroll, Math.max(0, drag.startTop + delta));
    update();
  });
  const endDrag = (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    if (hit.hasPointerCapture(e.pointerId)) hit.releasePointerCapture(e.pointerId);
    drag = null;
    delete shell.dataset.drag;
  };
  hit.addEventListener("pointerup", endDrag);
  hit.addEventListener("pointercancel", endDrag);
  hit.addEventListener("lostpointercapture", endDrag);

  const scrollTarget = page ? window : scrollNode;
  scrollTarget.addEventListener("scroll", update, { passive: true });
  // typing and pasting grow a textarea's scrollHeight without any observer
  // firing — the input event is the only DOM signal for it
  scrollNode.addEventListener?.("input", update, { passive: true });
  let ro = null;
  if (typeof ResizeObserver !== "undefined") {
    ro = new ResizeObserver(update);
    ro.observe(page ? document.body : scrollNode);
  }
  if (page) window.addEventListener("resize", update, { passive: true });
  // setTimeout, not rAF: animation frames stall in hidden tabs, and the
  // first measurement must happen regardless
  setTimeout(update, 0);

  return {
    update,
    destroy() {
      scrollTarget.removeEventListener("scroll", update);
      scrollNode.removeEventListener?.("input", update);
      if (ro) ro.disconnect();
      if (page) window.removeEventListener("resize", update);
      shell.remove();
    },
  };
}

/* ===== src/card.js ===== */
// Share card encoding: bech32m (BIP-350) with HRP "psr".
//
// Card payload before 5-bit conversion:
//   version symbol (5-bit value 1, kept outside the byte payload)
//   bytes: index (1) || set_id (2) || share_y (32)  = 35 bytes
// 35 bytes -> 56 five-bit symbols exactly. Full string:
//   "psr" "1" <version:1><payload:56><checksum:6>  = 67 characters.
// The BCH checksum guarantees detection of any error touching up to 4
// characters at this length, and misses worse corruption with
// probability ~2^-30.

const HRP = "psr";
const CARD_VERSION = 1;
const CARD_LENGTH = 67;
const SHARE_LEN = 32;

const CHARSET = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
const BECH32M_CONST = 0x2bc830a3;
const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];

class CardError extends Error {
  constructor(code, message) {
    super(message);
    this.name = "CardError";
    this.code = code; // BAD_CHARSET | BAD_CHECKSUM | BAD_HRP | BAD_VERSION | BAD_LENGTH
  }
}

function polymod(values) {
  let chk = 1;
  for (const v of values) {
    const top = chk >>> 25;
    chk = ((chk & 0x1ffffff) << 5) ^ v;
    for (let i = 0; i < 5; i++) {
      if ((top >>> i) & 1) chk ^= GEN[i];
    }
  }
  return chk >>> 0;
}

function hrpExpand(hrp) {
  const out = [];
  for (let i = 0; i < hrp.length; i++) out.push(hrp.charCodeAt(i) >> 5);
  out.push(0);
  for (let i = 0; i < hrp.length; i++) out.push(hrp.charCodeAt(i) & 31);
  return out;
}

function createChecksum(hrp, data) {
  const values = [...hrpExpand(hrp), ...data, 0, 0, 0, 0, 0, 0];
  const mod = polymod(values) ^ BECH32M_CONST;
  const out = [];
  for (let i = 0; i < 6; i++) out.push((mod >>> (5 * (5 - i))) & 31);
  return out;
}

function verifyChecksum(hrp, data) {
  return polymod([...hrpExpand(hrp), ...data]) === BECH32M_CONST;
}

/** General bech32m encode (exported for test vectors). */
function bech32mEncode(hrp, data) {
  const combined = [...data, ...createChecksum(hrp, data)];
  return hrp + "1" + combined.map((d) => CHARSET.charAt(d)).join("");
}

/** General bech32m decode -> { hrp, data } (checksum stripped). Throws CardError. */
function bech32mDecode(str) {
  const pos = str.lastIndexOf("1");
  if (pos < 1 || pos + 7 > str.length) {
    throw new CardError("BAD_LENGTH", "not a valid code: missing or misplaced separator");
  }
  const hrp = str.slice(0, pos);
  const data = [];
  for (const ch of str.slice(pos + 1)) {
    const d = CHARSET.indexOf(ch);
    if (d === -1) throw new CardError("BAD_CHARSET", `invalid character "${ch}"`);
    data.push(d);
  }
  if (!verifyChecksum(hrp, data)) {
    throw new CardError("BAD_CHECKSUM", "checksum mismatch, there is a typo somewhere");
  }
  return { hrp, data: data.slice(0, -6) };
}

/** Convert between bit group sizes (BIP-173 reference semantics). */
function convertBits(data, from, to, pad) {
  let acc = 0;
  let bits = 0;
  const out = [];
  const maxv = (1 << to) - 1;
  for (const value of data) {
    if (value < 0 || value >> from !== 0) throw new CardError("BAD_CHARSET", "invalid data value");
    acc = (acc << from) | value;
    bits += from;
    while (bits >= to) {
      bits -= to;
      out.push((acc >> bits) & maxv);
    }
  }
  if (pad) {
    if (bits > 0) out.push((acc << (to - bits)) & maxv);
  } else if (bits >= from || ((acc << (to - bits)) & maxv) !== 0) {
    throw new CardError("BAD_LENGTH", "invalid padding in data");
  }
  return out;
}

/** Encode one share card. setId: Uint8Array(2), shareY: Uint8Array(32). */

    throw new RangeError("key index must be 1..255");
  }
  if (setId.length !== 2 || shareY.length !== SHARE_LEN) {
    throw new RangeError("bad setId or share length");
  }
  const payload = new Uint8Array(1 + 2 + SHARE_LEN);
  payload[0] = index;
  payload.set(setId, 1);
  payload.set(shareY, 3);
  const data = [CARD_VERSION, ...convertBits(payload, 8, 5, true)];
  const s = bech32mEncode(HRP, data);
  if (s.length !== CARD_LENGTH) throw new Error(`internal: key length ${s.length}`);
  // canonical form is uppercase — the same form the card is written in
  // (bech32m allows either case; the checksum math runs over lowercase)
  return s.toUpperCase();

/**
 * Normalize handwritten input: strip separators/whitespace, uppercase
 * (the canonical form). Mixed case is accepted (normalized) — friendlier
 * for hand-typed entry, and the checksum still validates the result. The
 * letter "o" is not in the bech32 charset, so any o/O typed is a misread
 * zero: map it to "0".

  return raw.replace(/[\s\-.·_]/g, "").toUpperCase().replace(/O/g, "0");

/** Decode one card string -> { version, index, setId, shareY }. Throws CardError. */
function decodeCard(raw) {
  const str = normalizeCardInput(raw);
  if (str.length !== CARD_LENGTH) {
    throw new CardError(
      "BAD_LENGTH",
      `a key code is exactly ${CARD_LENGTH} characters, got ${str.length}`
    );
  }
  // bech32m arithmetic is defined over the lowercase charset
  const { hrp, data } = bech32mDecode(str.toLowerCase());
  if (hrp !== HRP) throw new CardError("BAD_HRP", `expected a "${HRP}" key code`);
  if (data.length === 0 || data[0] !== CARD_VERSION) {
    throw new CardError("BAD_VERSION", "unknown key version. Is this from a newer kit?");
  }
  const payload = Uint8Array.from(convertBits(data.slice(1), 5, 8, false));
  if (payload.length !== 1 + 2 + SHARE_LEN) {
    throw new CardError("BAD_LENGTH", "key payload has the wrong size");
  }
  return {
    version: CARD_VERSION,
    index: payload[0],
    setId: payload.slice(1, 3),
    shareY: payload.slice(3),
  };
}

/**
 * Display form: "PSR1 XXXX XXXX ..." — the canonical uppercase string in
 * groups of 4 after the prefix. Uppercase removes the l/1/I lookalikes
 * when handwritten, and the charset has no O, no I and no B, so the only
 * letter-vs-digit pair left is 0 (always the digit — input maps O back
 * to 0). Decode tolerates any case and grouping.
 */
function formatCardForDisplay(card) {
  const s = card.toUpperCase();
  const head = s.slice(0, 4);
  const rest = s.slice(4);
  const groups = [];
  for (let i = 0; i < rest.length; i += 4) groups.push(rest.slice(i, i + 4));
  return [head, ...groups].join(" ");

// Shamir secret sharing over GF(256), byte-wise: one independent
// degree-(k-1) polynomial per secret byte, share x-coordinate = card
// index 1..n. Any k shares interpolate the secret; k-1 shares carry
// zero information (each unknown coefficient is uniform random).



const MIN_K = 2;
const MAX_N = 255;

/**
 * Split `secret` into n shares with threshold k.
 * randomBytes(len) -> Uint8Array supplies polynomial coefficients;
 * production passes crypto.getRandomValues-backed bytes, tests may
 * pass a seeded generator (determinism for known-answer vectors).
 * Returns [{ index, y: Uint8Array }] with index 1..n.
 */
function split(secret, k, n, randomBytes) {
  if (!(secret instanceof Uint8Array) || secret.length === 0) {
    throw new TypeError("secret must be a non-empty Uint8Array");
  }
  if (!Number.isInteger(k) || !Number.isInteger(n)) {
    throw new TypeError("k and n must be integers");
  }
  if (k < MIN_K) throw new RangeError(`threshold k must be >= ${MIN_K}`);
  if (n < k) throw new RangeError("n must be >= k");
  if (n > MAX_N) throw new RangeError(`n must be <= ${MAX_N}`);

  // coefficients a_1..a_{k-1} for every secret byte, drawn up front
  const coefBytes = randomBytes(secret.length * (k - 1));
  if (!(coefBytes instanceof Uint8Array) || coefBytes.length !== secret.length * (k - 1)) {
    throw new TypeError("randomBytes returned wrong length");
  }

  const shares = [];
  for (let x = 1; x <= n; x++) {
    shares.push({ index: x, y: new Uint8Array(secret.length) });
  }
  const coeffs = new Uint8Array(k);
  for (let b = 0; b < secret.length; b++) {
    coeffs[0] = secret[b];
    for (let c = 1; c < k; c++) {
      coeffs[c] = coefBytes[b * (k - 1) + (c - 1)];
    }
    for (const share of shares) {
      share.y[b] = polyEval(coeffs, share.index);
    }
  }
  coeffs.fill(0);
  coefBytes.fill(0);
  return shares;
}

/**
 * Combine exactly k shares [{ index, y }] back into the secret.
 * Caller is responsible for passing precisely the threshold count;
 * duplicate or out-of-range indices throw.
 */
function combine(shares) {
  if (!Array.isArray(shares) || shares.length < MIN_K) {
    throw new RangeError(`need at least ${MIN_K} shares`);
  }
  const seen = new Set();
  const len = shares[0].y.length;
  for (const s of shares) {
    if (!Number.isInteger(s.index) || s.index < 1 || s.index > MAX_N) {
      throw new RangeError(`share index ${s.index} out of range`);
    }
    if (seen.has(s.index)) throw new RangeError(`duplicate share index ${s.index}`);
    seen.add(s.index);
    if (!(s.y instanceof Uint8Array) || s.y.length !== len) {
      throw new TypeError("shares have mismatched lengths");
    }
  }
  const xs = shares.map((s) => s.index);
  const secret = new Uint8Array(len);
  const ys = new Array(shares.length);
  for (let b = 0; b < len; b++) {
    for (let i = 0; i < shares.length; i++) ys[i] = shares[i].y[b];
    secret[b] = interpolateAtZero(xs, ys);
  }
  return secret;
}

/* ===== src/vault.js ===== */
// PKR vault container: the byte format embedded (base64) in a
// personalized RECOVERY.html. Layout (little-endian):
//
//   off        len   field
//   0          8     magic 89 50 4B 52 0D 0A 1A 0A  ("\x89PKR\r\n\x1a\n")
//   8          2     format_version = 1
//   10         8     created_at (unix seconds, u64)
//   18         1     threshold k
//   19         1     shares n
//   20         2     set_id (random per ceremony)
//   22         32    hkdf_salt (random)
//   54         32    K_app (random 32-byte key half held by the kit file)
//   86         12    AES-GCM nonce (random, fresh per encryption)
//   98         32*n  share commitments, i = 1..n:
//                      SHA-256("PKRv1 share-commit" || hkdf_salt || index || share_y)
//   98+32n     4     ct_len (u32)
//   102+32n    var   ciphertext || 16-byte GCM tag
//   end-32     32    file_digest = SHA-256(all preceding bytes)
//
// AAD for the AEAD = bytes 0 .. 102+32n (magic through ct_len): any
// header tamper fails decryption cryptographically. The trailing digest
// is the non-cryptographic freshness/bit-rot check ("kit fingerprint" =
// first 4 digest bytes as 8 hex chars).
//
// Decryption key = HKDF-SHA256(salt = hkdf_salt,
//                              IKM  = K_app || K_share  (fixed order),
//                              info = "PKRv1 vault-key", L = 32).





const FORMAT_VERSION = 1;
const MIN_CARDS = 2;
const MAX_CARDS = 10;
const MAGIC = Uint8Array.of(0x89, 0x50, 0x4b, 0x52, 0x0d, 0x0a, 0x1a, 0x0a);
const HKDF_INFO = new TextEncoder().encode("PKRv1 vault-key");
const COMMIT_PREFIX = new TextEncoder().encode("PKRv1 share-commit");

class VaultError extends Error {
  constructor(code, message, cardSlot = null) {
    super(message);
    this.name = "VaultError";
    this.code = code;
    // 1-based position of the offending card in the user's input, when known
    this.cardSlot = cardSlot;
  }
}

function validateParams(k, n) {
  if (!Number.isInteger(k) || !Number.isInteger(n)) {
    throw new VaultError("BAD_PARAMS", "k and n must be integers");
  }
  if (k < 2) throw new VaultError("BAD_PARAMS", "threshold must be at least 2 keys");
  if (n < MIN_CARDS || n > MAX_CARDS) {
    throw new VaultError("BAD_PARAMS", `number of keys must be ${MIN_CARDS}..${MAX_CARDS}`);
  }
  if (k > n) throw new VaultError("BAD_PARAMS", "threshold cannot exceed the number of keys");
}

async function commitment(salt, index, shareY) {
  const buf = new Uint8Array(COMMIT_PREFIX.length + salt.length + 1 + shareY.length);
  buf.set(COMMIT_PREFIX, 0);
  buf.set(salt, COMMIT_PREFIX.length);
  buf[COMMIT_PREFIX.length + salt.length] = index;
  buf.set(shareY, COMMIT_PREFIX.length + salt.length + 1);
  return sha256(buf);
}

async function deriveKey(salt, kApp, kShare) {
  const ikm = new Uint8Array(64);
  ikm.set(kApp, 0);
  ikm.set(kShare, 32);
  const key = await hkdfSha256(ikm, salt, HKDF_INFO, 32);
  ikm.fill(0);
  return key;
}

function buildBytes(header, ct, digest) {
  const out = new Uint8Array(header.length + ct.length + 32);
  out.set(header, 0);
  out.set(ct, header.length);
  out.set(digest, header.length + ct.length);
  return out;
}

async function assemble({ createdAt, k, n, setId, salt, kApp, nonce, commitments, ct }) {
  const header = new Uint8Array(102 + 32 * n);
  const dv = new DataView(header.buffer);
  header.set(MAGIC, 0);
  dv.setUint16(8, FORMAT_VERSION, true);
  dv.setBigUint64(10, BigInt(createdAt), true);
  header[18] = k;
  header[19] = n;
  header.set(setId, 20);
  header.set(salt, 22);
  header.set(kApp, 54);
  header.set(nonce, 86);
  for (let i = 0; i < n; i++) header.set(commitments[i], 98 + 32 * i);
  dv.setUint32(98 + 32 * n, ct.length, true);
  const digest = await sha256(buildBytes(header, ct, new Uint8Array(0)).slice(0, header.length + ct.length));
  return buildBytes(header, ct, digest);
}

/**
 * The password may arrive as a string or as UTF-8 bytes. Bytes are what the
 * app hands over: a Uint8Array can be zeroed once the ciphertext exists,
 * where a string would linger in the heap until collected. Either way the
 * array returned here is the one that gets wiped — callers passing bytes
 * are handing over ownership of them.
 */
function passwordBytes(password) {
  return typeof password === "string" ? new TextEncoder().encode(password) : password;
}

/**
 * Run a full split ceremony.
 * Returns { bytes, cards, setIdHex, fingerprint, k, n, createdAt }.
 * ("cards" is the internal name for the handwritten key codes.)
 * `randomBytes(len)` supplies ALL randomness (injectable for tests);
 * `createdAt` is unix seconds.
 */
async function createVault(password, k, n, randomBytes, createdAt) {
  validateParams(k, n);
  const pwBytes = passwordBytes(password);
  const padded = padPassword(pwBytes);

  const kShare = randomBytes(32);
  const kApp = randomBytes(32);
  const salt = randomBytes(32);
  const nonce = randomBytes(12);
  const setId = randomBytes(2);

  const shares = split(kShare, k, n, randomBytes);
  const commitments = [];
  for (const s of shares) commitments.push(await commitment(salt, s.index, s.y));

  const key = await deriveKey(salt, kApp, kShare);
  // AAD = header bytes; build header with a placeholder pass first is
  // avoided by computing ct length up front (plaintext + 16-byte tag).
  const headerLen = 102 + 32 * n;
  const aadProbe = new Uint8Array(headerLen);
  {
    const dv = new DataView(aadProbe.buffer);
    aadProbe.set(MAGIC, 0);
    dv.setUint16(8, FORMAT_VERSION, true);
    dv.setBigUint64(10, BigInt(createdAt), true);
    aadProbe[18] = k;
    aadProbe[19] = n;
    aadProbe.set(setId, 20);
    aadProbe.set(salt, 22);
    aadProbe.set(kApp, 54);
    aadProbe.set(nonce, 86);
    for (let i = 0; i < n; i++) aadProbe.set(commitments[i], 98 + 32 * i);
    dv.setUint32(98 + 32 * n, padded.length + 16, true);
  }
  const ct = await aesGcmSeal(key, nonce, aadProbe, padded);
  if (ct.length !== padded.length + 16) {
    throw new Error("internal: unexpected ciphertext length");
  }
  key.fill(0);
  padded.fill(0);
  pwBytes.fill(0);

  const bytes = await assemble({ createdAt, k, n, setId, salt, kApp, nonce, commitments, ct });
  const cards = shares.map((s) => encodeCard(s.index, setId, s.y));
  kShare.fill(0);
  for (const s of shares) s.y.fill(0);

  const digest = bytes.slice(bytes.length - 32);
  return {
    bytes,
    cards,
    k,
    n,
    createdAt,
    setIdHex: toHex(setId).toUpperCase(),
    fingerprint: toHex(digest.slice(0, 4)).toUpperCase(),
  };
}

/** Parse + integrity-check PKR bytes. Throws VaultError. */
async function parseVault(bytes) {
  if (bytes.length < 8 || !bytesEqual(bytes.slice(0, 8), MAGIC)) {
    throw new VaultError(
      "BAD_MAGIC",
      "not a PKR vault (file corrupted, possibly by a text-mode copy?)"
    );
  }
  if (bytes.length < 102 + 32 * MIN_CARDS + 16 + 32) {
    throw new VaultError("TRUNCATED", "vault file is truncated");
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const version = dv.getUint16(8, true);
  if (version !== FORMAT_VERSION) {
    throw new VaultError("BAD_VERSION", `unsupported vault version ${version}`);
  }
  const createdAt = Number(dv.getBigUint64(10, true));
  const k = bytes[18];
  const n = bytes[19];
  try {
    validateParams(k, n);
  } catch {
    throw new VaultError("BAD_PARAMS", "vault header has invalid k/n parameters");
  }
  const headerLen = 102 + 32 * n;
  if (bytes.length < headerLen + 16 + 32) {
    throw new VaultError("TRUNCATED", "vault file is truncated");
  }
  const ctLen = dv.getUint32(98 + 32 * n, true);
  if (bytes.length !== headerLen + ctLen + 32) {
    throw new VaultError("TRUNCATED", "vault length does not match its header");
  }
  const digest = await sha256(bytes.slice(0, headerLen + ctLen));
  if (!bytesEqual(digest, bytes.slice(headerLen + ctLen))) {
    throw new VaultError(
      "DIGEST_MISMATCH",
      "vault integrity check failed. This copy is corrupted; try the other USB stick"
    );
  }
  const commitments = [];
  for (let i = 0; i < n; i++) commitments.push(bytes.slice(98 + 32 * i, 98 + 32 * (i + 1)));
  return {
    version,
    createdAt,
    k,
    n,
    setId: bytes.slice(20, 22),
    salt: bytes.slice(22, 54),
    kApp: bytes.slice(54, 86),
    nonce: bytes.slice(86, 98),
    commitments,
    aad: bytes.slice(0, headerLen),
    ct: bytes.slice(headerLen, headerLen + ctLen),
    setIdHex: toHex(bytes.slice(20, 22)).toUpperCase(),
    fingerprint: toHex(digest.slice(0, 4)).toUpperCase(),
  };
}

/**
 * Validate one decoded key against a parsed vault.
 * slot is the 1-based input position, used only for error messages.
 */
async function checkCard(vault, key, slot) {
  if (!bytesEqual(key.setId, vault.setId)) {
    throw new VaultError(
      "SET_MISMATCH",
      `key in slot ${slot} is from a different key set (kit expects set ${vault.setIdHex})`,
      slot
    );
  }
  if (key.index < 1 || key.index > vault.n) {
    throw new VaultError("BAD_INDEX", `key in slot ${slot} has index ${key.index}, kit has only ${vault.n} keys`, slot);
  }
  const expected = vault.commitments[key.index - 1];
  const actual = await commitment(vault.salt, key.index, key.shareY);
  if (!bytesEqual(expected, actual)) {
    throw new VaultError(
      "COMMITMENT_MISMATCH",
      `key in slot ${slot} is valid text but does not belong to this vault file`,
      slot
    );
  }
}

/**
 * Recover the password as UTF-8 bytes. The caller owns the array and should
 * zero it once done: bytes can be wiped, the string a decode would produce
 * cannot. `recoverPassword` below is the string form, for callers that have
 * to hand the value to something text-shaped.
 */
async function recoverPasswordBytes(vault, keys) {
  if (keys.length !== vault.k) {
    throw new VaultError("NEED_K", `exactly ${vault.k} keys are required, got ${keys.length}`);
  }
  const seen = new Set();
  for (let i = 0; i < keys.length; i++) {
    // membership first: a foreign key should say "wrong set", not
    // "entered twice", even when its index collides with a valid key
    await checkCard(vault, keys[i], i + 1);
    if (seen.has(keys[i].index)) {
      throw new VaultError("DUPLICATE", `the same key was entered twice (key ${keys[i].index})`, i + 1);
    }
    seen.add(keys[i].index);
  }
  const kShare = combine(keys.map((c) => ({ index: c.index, y: c.shareY })));
  const key = await deriveKey(vault.salt, vault.kApp, kShare);
  kShare.fill(0);
  let padded;
  try {
    padded = await aesGcmOpen(key, vault.nonce, vault.aad, vault.ct);
  } catch {
    throw new VaultError(
      "AEAD_FAIL",
      "keys verified but decryption failed. The vault file is damaged; try the other USB stick"
    );
  } finally {
    key.fill(0);
  }
  const pw = unpadPassword(padded);
  padded.fill(0);
  return pw;
}

/** Recover the password as a string. */
async function recoverPassword(vault, keys) {
  const pw = await recoverPasswordBytes(vault, keys);
  const text = new TextDecoder().decode(pw);
  pw.fill(0);
  return text;
}

/**
 * Rotation: same key set, new password. Requires k valid keys (proves
 * possession), keeps K_app/salt/set_id/commitments, draws a fresh nonce.
 */
async function rotateVault(vault, keys, newPassword, randomBytes, createdAt) {
  if (keys.length !== vault.k) {
    throw new VaultError("NEED_K", `exactly ${vault.k} keys are required, got ${keys.length}`);
  }
  const seen = new Set();
  for (let i = 0; i < keys.length; i++) {
    await checkCard(vault, keys[i], i + 1);
    if (seen.has(keys[i].index)) {
      throw new VaultError("DUPLICATE", `the same key was entered twice (key ${keys[i].index})`, i + 1);
    }
    seen.add(keys[i].index);
  }
  const kShare = combine(keys.map((c) => ({ index: c.index, y: c.shareY })));
  const key = await deriveKey(vault.salt, vault.kApp, kShare);
  kShare.fill(0);

  const pwBytes = passwordBytes(newPassword);
  const padded = padPassword(pwBytes);
  const nonce = randomBytes(12);
  const n = vault.n;
  const headerLen = 102 + 32 * n;
  const aad = new Uint8Array(headerLen);
  const dv = new DataView(aad.buffer);
  aad.set(MAGIC, 0);
  dv.setUint16(8, FORMAT_VERSION, true);
  dv.setBigUint64(10, BigInt(createdAt), true);
  aad[18] = vault.k;
  aad[19] = n;
  aad.set(vault.setId, 20);
  aad.set(vault.salt, 22);
  aad.set(vault.kApp, 54);
  aad.set(nonce, 86);
  for (let i = 0; i < n; i++) aad.set(vault.commitments[i], 98 + 32 * i);
  dv.setUint32(98 + 32 * n, padded.length + 16, true);

  const ct = await aesGcmSeal(key, nonce, aad, padded);
  key.fill(0);
  padded.fill(0);
  pwBytes.fill(0);
  const digest = await sha256(buildBytes(aad, ct, new Uint8Array(0)).slice(0, headerLen + ct.length));
  const bytes = buildBytes(aad, ct, digest);
  return {
    bytes,
    k: vault.k,
    n,
    createdAt,
    setIdHex: vault.setIdHex,
    fingerprint: toHex(digest.slice(0, 4)).toUpperCase(),
  };
}

/* ===== src/selftest.js ===== */
// Built-in self-test: known-answer tests for every primitive plus a
// full split -> encode -> decode -> combine -> decrypt round trip.
// Runs identically under node:test and behind the app's Self-test view;
// the letter tells recoverers to run it before anything else.







function combinations(arr, k) {
  if (k === 0) return [[]];
  if (arr.length < k) return [];
  const [head, ...rest] = arr;
  return [
    ...combinations(rest, k - 1).map((c) => [head, ...c]),
    ...combinations(rest, k),
  ];
}

const CHECKS = [
  {
    name: "GF(256) Field Arithmetic",
    detail: "AES-field products and inverses match known answers",
    async run() {
      // classic AES-field products and inverses
      if (gfMul(0x53, 0xca) !== 0x01) throw new Error("0x53*0xCA != 1");
      if (gfMul(0x57, 0x83) !== 0xc1) throw new Error("0x57*0x83 != 0xC1");
      if (gfInv(0x53) !== 0xca) throw new Error("inv(0x53) != 0xCA");
      for (let a = 1; a < 256; a++) {
        if (gfMul(a, gfInv(a)) !== 1) throw new Error(`a*inv(a) != 1 for a=${a}`);
      }
      if (polyEval([5, 3, 2], 0) !== 5) throw new Error("polyEval constant term");
    },
  },
  {
    name: "SHA-256 Known Answer",
    detail: "SHA-256 of \"abc\" matches the published digest",
    async run() {
      const d = await sha256(new TextEncoder().encode("abc"));
      const want = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad";
      if (toHex(d) !== want) throw new Error("SHA-256(abc) mismatch");
    },
  },
  {
    name: "HKDF-SHA256 RFC 5869 Test Case 1",
    detail: "Key derivation matches the RFC test vector",
    async run() {
      const okm = await hkdfSha256(
        fromHex("0b".repeat(22)),
        fromHex("000102030405060708090a0b0c"),
        fromHex("f0f1f2f3f4f5f6f7f8f9"),
        42
      );
      const want =
        "3cb25f25faacd57a90434f64d0362f2a" +
        "2d2d0a90cf1a5a4c5db02d56ecc4c5bf" +
        "34007208d5b887185865";
      if (toHex(okm) !== want) throw new Error("HKDF OKM mismatch");
    },
  },
  {
    name: "AES-256-GCM NIST Known Answer",
    detail: "Encryption matches the NIST vector",
    async run() {
      const out = await aesGcmSeal(
        new Uint8Array(32),
        new Uint8Array(12),
        new Uint8Array(0),
        new Uint8Array(16)
      );
      const want =
        "cea7403d4d606b6e074ec5d3baf39d18" + "d0d1c8a799996bf0265b98b5d48ab919";
      if (toHex(out) !== want) throw new Error("AES-GCM vector mismatch");
    },
  },
  {
    name: "Bech32m BIP-350 Vectors",
    detail: "Reference codes round-trip; a corrupted one is rejected",
    async run() {
      const valid = [
        "a1lqfn3a",
        "abcdef1l7aum6echk45nj3s0wdvt2fg8x9yrzpqzd3ryx",
        "split1checkupstagehandshakeupstreamerranterredcaperredlc445v",
      ];
      for (const v of valid) {
        const { hrp, data } = bech32mDecode(v);
        if (bech32mEncode(hrp, data) !== v) throw new Error(`re-encode mismatch for ${v}`);
      }
      let threw = false;
      try {
        bech32mDecode("a1lqfn33"); // corrupted last char
      } catch {
        threw = true;
      }
      if (!threw) throw new Error("corrupted string accepted");
    },
  },
  {
    name: "Key Encode/Decode Round Trip",
    detail: "A key survives upper case and added spaces",
    async run() {
      const setId = Uint8Array.of(0xa7, 0xf2);
      const share = Uint8Array.from({ length: 32 }, (_, i) => (i * 7 + 3) & 0xff);
      const key = encodeCard(3, setId, share);
      if (key.length !== CARD_LENGTH) throw new Error(`key length ${key.length}`);
      const dec = decodeCard(key.toUpperCase().replace(/(.{4})/g, "$1 "));
      if (dec.index !== 3 || !bytesEqual(dec.setId, setId) || !bytesEqual(dec.shareY, share)) {
        throw new Error("decoded key differs");
      }
    },
  },
  {
    name: "Shamir Split/Combine (3-of-5, All 10 Combos)",
    detail: "Every three-key combination returns the secret",
    async run() {
      const secret = randomBytes(32);
      const shares = split(secret, 3, 5, randomBytes);
      for (const combo of combinations(shares, 3)) {
        if (!bytesEqual(combine(combo), secret)) throw new Error("combo failed to recover");
      }
    },
  },
  {
    name: "Full Ceremony Round Trip (Dummy Secret)",
    detail: "A sample kit recovers; any two keys are refused",
    async run() {
      const password = "self-test dummy pässword ✓";
      const { bytes, cards } = await createVault(password, 3, 5, randomBytes, 1_700_000_000);
      const vault = await parseVault(bytes);
      const decoded = cards.map((c) => decodeCard(c));
      for (const combo of combinations(decoded, 3)) {
        const got = await recoverPassword(vault, combo);
        if (got !== password) throw new Error("recovered password differs");
      }
      // k-1 keys must be refused
      let refused = false;
      try {
        await recoverPassword(vault, decoded.slice(0, 2));
      } catch {
        refused = true;
      }
      if (!refused) throw new Error("k-1 keys were not refused");
    },
  },
];

/** Names and one-line descriptions, for a UI that lists the checks
 *  before they have run. Same order as the results. */
const SELF_TEST_CHECKS = CHECKS.map((c) => ({ name: c.name, detail: c.detail }));

/**
 * Run all checks; returns [{ name, detail, ok, error, ms }]. Never throws.
 * `onResult(result, index)` is awaited after each check, so a UI can show
 * progress while the run is still going.
 */
async function runSelfTest(onResult) {
  const results = [];
  for (let i = 0; i < CHECKS.length; i++) {
    const check = CHECKS[i];
    const started = Date.now();
    let result;
    try {
      await check.run();
      result = { name: check.name, detail: check.detail, ok: true, error: null, ms: 0 };
    } catch (err) {
      result = {
        name: check.name,
        detail: check.detail,
        ok: false,
        error: String(err?.message ?? err),
        ms: 0,
      };
    }
    result.ms = Date.now() - started;
    results.push(result);
    if (onResult) await onResult(result, i);
  }
  return results;
}

// Application shell. This file is concatenated after the core modules
// by build.mjs into one inline script block, so it must not redeclare
// any name the modules export (split, combine, subtle, MAGIC, ...).
//
// IMPORTANT: no string or comment in this file may contain a literal
// script tag (opening or closing) — the opening form would break the
// build's tag-count lint, the closing form would terminate the inline
// script. Both are always assembled by concatenation below. The build
// also rejects URL-shaped and network-shaped strings, so nothing here
// may spell out a scheme or a network API.
